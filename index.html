/* =====================================================================
   Dashboard rendering — every chart is hand-rolled inline SVG so the file
   stays dependency-free and prints as vector.
   ===================================================================== */
const YEAR_RAMP = ['#86b6ef', '#5598e7', '#2a78d6', '#184f95'];  // ordinal: older = lighter
const CAT_COLORS = {
  'LABOUR': '#2a78d6', 'STOCK': '#eb6834', 'TIRES': '#1baf7a',
  'CONSUMABLES': '#eda100', 'SUBLET REPAIR': '#e87ba4',
};
const CAT_FALLBACK = ['#4a3aa7', '#008300', '#e34948'];

// Colour follows the category NAME, never its rank, so filtering one out never
// repaints the others.
function catColor(name, i) { return CAT_COLORS[name] || CAT_FALLBACK[i % CAT_FALLBACK.length]; }
function yearColor(y, years) {
  const i = years.indexOf(y), n = years.length;
  if (n <= YEAR_RAMP.length) return YEAR_RAMP[YEAR_RAMP.length - n + i];
  return YEAR_RAMP[Math.round(i / (n - 1) * (YEAR_RAMP.length - 1))];
}
function inkOn(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 > 0.6 ? '#0b0b0b' : '#ffffff';
}

function f1(n) { return Math.round(n * 10) / 10; }
function niceStep(raw) {
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
}
function axisTicks(max, count) {
  if (!(max > 0)) return { max: 1, ticks: [0, 1] };
  const step = niceStep(max / (count || 4));
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top + step * 1e-6; v += step) ticks.push(v);
  return { max: top, ticks };
}
function compactMoney(v) {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e6) return s + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e3) return s + '$' + Math.round(a / 1e3) + 'K';
  return s + '$' + Math.round(a);
}
// Rounded data-end, square at the baseline.
function barPath(x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, w / 2, h));
  return 'M' + f1(x) + ',' + f1(y + h) + 'L' + f1(x) + ',' + f1(y + rr) +
    'Q' + f1(x) + ',' + f1(y) + ' ' + f1(x + rr) + ',' + f1(y) +
    'L' + f1(x + w - rr) + ',' + f1(y) + 'Q' + f1(x + w) + ',' + f1(y) + ' ' + f1(x + w) + ',' + f1(y + rr) +
    'L' + f1(x + w) + ',' + f1(y + h) + 'Z';
}

function sparkColumns(vals, curIdx) {
  const W = 150, H = 26, n = vals.length || 1;
  const max = Math.max(1, ...vals.map(v => Math.abs(v)));
  const band = W / n, bw = Math.max(1.5, band - 1.6);
  let out = '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" height="26" preserveAspectRatio="none" aria-hidden="true">';
  vals.forEach((v, i) => {
    const h = Math.max(1, Math.abs(v) / max * (H - 2));
    out += '<rect x="' + f1(i * band) + '" y="' + f1(H - h) + '" width="' + f1(bw) + '" height="' + f1(h) +
      '" rx="1" fill="' + (i === curIdx ? 'var(--c-sel)' : 'var(--c-ctx)') + '"/>';
  });
  return out + '</svg>';
}

// Percentage deltas. GP% is compared in percentage POINTS — a margin moving
// 46% -> 48% is "+2.0 pts", not "+4.3%".
function deltaHtml(cur, prev, label, mode) {
  if (prev == null) return '<span class="d">vs ' + esc(label) + ': —</span>';
  if (mode === 'pts') {
    const d = cur - prev;
    if (!isFinite(d)) return '<span class="d">vs ' + esc(label) + ': —</span>';
    const up = d >= 0.005;
    const flat = Math.abs(d) < 0.05;
    return '<span class="d ' + (flat ? '' : up ? 'up' : 'down') + '">vs ' + esc(label) + ': <b>' +
      (flat ? '±0.0' : (up ? '▲' : '▼') + Math.abs(d).toFixed(1)) + ' pts</b></span>';
  }
  const p = pctChange(cur, prev);
  if (p == null) return '<span class="d">vs ' + esc(label) + ': —</span>';
  const flat = Math.abs(p) < 0.05;
  return '<span class="d ' + (flat ? '' : p >= 0 ? 'up' : 'down') + '">vs ' + esc(label) + ': <b>' +
    (flat ? '±0.0%' : (p >= 0 ? '▲' : '▼') + Math.abs(p).toFixed(1) + '%') + '</b></span>';
}

/* ----- chart 1: the long monthly trend, with the selected period emphasised ----- */
function trendChart(series, field, selFrom, selTo, partialSet, moneyFmt) {
  if (!series.length) return '';
  const W = 980, H = 236, padL = 54, padR = 10, padT = 10, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const vals = series.map(s => s[field]);
  const ax = axisTicks(Math.max(0, ...vals), 4);
  const band = plotW / series.length;
  const bw = Math.min(24, Math.max(2, band - 3));
  const yOf = v => padT + plotH - (Math.max(0, v) / ax.max) * plotH;
  const ma = movingAverage(series, field, 3);

  let g = '';
  for (const t of ax.ticks) {
    const y = yOf(t);
    g += '<line class="gridline" x1="' + padL + '" y1="' + f1(y) + '" x2="' + (W - padR) + '" y2="' + f1(y) + '"/>' +
      '<text class="tick" x="' + (padL - 7) + '" y="' + f1(y + 3.5) + '" text-anchor="end">' + (moneyFmt ? compactMoney(t) : Math.round(t)) + '</text>';
  }
  let bars = '', labels = '';
  series.forEach((s, i) => {
    const x = padL + i * band + (band - bw) / 2;
    const v = s[field];
    const h = Math.max(v > 0 ? 1.5 : 0, padT + plotH - yOf(v));
    const sel = s.mk >= selFrom && s.mk <= selTo;
    const isPartial = partialSet.has(s.mk);
    if (v > 0) {
      bars += '<path d="' + barPath(x, yOf(v), bw, h, 2.5) + '" fill="' + (sel ? 'var(--c-sel)' : 'var(--c-ctx)') + '"' +
        (isPartial ? ' opacity="0.45"' : '') + '><title>' + esc(MONTH_ABBR[s.mo - 1] + ' ' + s.y) + ': ' +
        (moneyFmt ? fmtMoney(v) : v) + (isPartial ? ' (partial month)' : '') + '</title></path>';
    }
    if (s.mo === 1 || i === 0) {
      labels += '<text class="tick b" x="' + f1(padL + i * band + band / 2) + '" y="' + (H - 10) + '" text-anchor="middle">' + s.y + '</text>';
    } else if (s.mo === 7) {
      labels += '<text class="tick" x="' + f1(padL + i * band + band / 2) + '" y="' + (H - 10) + '" text-anchor="middle">Jul</text>';
    }
  });
  let line = '';
  if (series.length > 3) {
    const pts = ma.map((v, i) => f1(padL + i * band + band / 2) + ',' + f1(yOf(v))).join(' ');
    line = '<polyline points="' + pts + '" fill="none" stroke="var(--c-ref)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>';
  }
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + bars + line +
    '<line class="baseline" x1="' + padL + '" y1="' + f1(padT + plotH) + '" x2="' + (W - padR) + '" y2="' + f1(padT + plotH) + '"/>' +
    labels + '</svg>';
}

/* ----- chart 2: same calendar month across years, grouped columns ----- */
function yoyChart(grid, moneyFmt) {
  const years = grid.years;
  if (!years.length) return '';
  const W = 980, H = 250, padL = 54, padR = 10, padT = 10, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  let max = 0;
  for (const y of years) for (const v of grid.byYear.get(y)) if (v != null && v > max) max = v;
  const ax = axisTicks(max, 4);
  const gband = plotW / 12;
  const bw = Math.min(18, Math.max(2, (gband - 12) / years.length - 1.6));
  const yOf = v => padT + plotH - (Math.max(0, v) / ax.max) * plotH;

  let g = '';
  for (const t of ax.ticks) {
    const y = yOf(t);
    g += '<line class="gridline" x1="' + padL + '" y1="' + f1(y) + '" x2="' + (W - padR) + '" y2="' + f1(y) + '"/>' +
      '<text class="tick" x="' + (padL - 7) + '" y="' + f1(y + 3.5) + '" text-anchor="end">' + (moneyFmt ? compactMoney(t) : Math.round(t)) + '</text>';
  }
  let bars = '', labels = '';
  for (let m = 0; m < 12; m++) {
    const groupW = years.length * bw + (years.length - 1) * 1.6;
    const x0 = padL + m * gband + (gband - groupW) / 2;
    years.forEach((yr, k) => {
      const v = grid.byYear.get(yr)[m];
      if (v == null) return;
      const x = x0 + k * (bw + 1.6);
      const h = Math.max(1.5, padT + plotH - yOf(v));
      bars += '<path d="' + barPath(x, yOf(v), bw, h, 2) + '" fill="' + yearColor(yr, years) + '">' +
        '<title>' + MONTH_ABBR[m] + ' ' + yr + ': ' + (moneyFmt ? fmtMoney(v) : v) + '</title></path>';
    });
    labels += '<text class="tick" x="' + f1(padL + m * gband + gband / 2) + '" y="' + (H - 10) + '" text-anchor="middle">' + MONTH_ABBR[m] + '</text>';
  }
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + bars +
    '<line class="baseline" x1="' + padL + '" y1="' + f1(padT + plotH) + '" x2="' + (W - padR) + '" y2="' + f1(padT + plotH) + '"/>' +
    labels + '</svg>';
}

/* ----- chart 3: seasonal shape, indexed so growth is not mistaken for season ----- */
function seasonChart(seas) {
  const W = 980, H = 190, padL = 54, padR = 10, padT = 10, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const max = Math.max(120, ...seas.map(s => s.index || 0));
  const ax = axisTicks(max, 4);
  const band = plotW / 12, bw = Math.min(34, band - 10);
  const yOf = v => padT + plotH - (Math.max(0, v) / ax.max) * plotH;
  let g = '';
  for (const t of ax.ticks) {
    const y = yOf(t);
    g += '<line class="gridline" x1="' + padL + '" y1="' + f1(y) + '" x2="' + (W - padR) + '" y2="' + f1(y) + '"/>' +
      '<text class="tick" x="' + (padL - 7) + '" y="' + f1(y + 3.5) + '" text-anchor="end">' + Math.round(t) + '</text>';
  }
  let bars = '', labels = '';
  seas.forEach((s, i) => {
    const x = padL + i * band + (band - bw) / 2;
    labels += '<text class="tick" x="' + f1(padL + i * band + band / 2) + '" y="' + (H - 10) + '" text-anchor="middle">' + MONTH_ABBR[i] + '</text>';
    if (s.index == null) return;
    const h = Math.max(1.5, padT + plotH - yOf(s.index));
    bars += '<path d="' + barPath(x, yOf(s.index), bw, h, 2.5) + '" fill="var(--c-sel)"><title>' +
      MONTH_ABBR[i] + ': ' + s.index.toFixed(0) + ' (100 = an average month, from ' + s.years + ' year' + (s.years === 1 ? '' : 's') + ')</title></path>' +
      '<text class="vlabel" x="' + f1(padL + i * band + band / 2) + '" y="' + f1(yOf(s.index) - 5) + '" text-anchor="middle">' + s.index.toFixed(0) + '</text>';
  });
  const y100 = yOf(100);
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + bars +
    '<line x1="' + padL + '" y1="' + f1(y100) + '" x2="' + (W - padR) + '" y2="' + f1(y100) + '" stroke="var(--c-ref)" stroke-width="2"/>' +
    '<text class="tick b" x="' + (padL + 5) + '" y="' + f1(y100 - 5) + '">average month = 100</text>' +
    '<line class="baseline" x1="' + padL + '" y1="' + f1(padT + plotH) + '" x2="' + (W - padR) + '" y2="' + f1(padT + plotH) + '"/>' +
    labels + '</svg>';
}

function legendHtml(entries) {
  return '<div class="legend">' + entries.map(e =>
    '<span><i class="' + (e.line ? 'line' : '') + '" style="background:' + e.color + '"></i>' + esc(e.label) + '</span>').join('') + '</div>';
}

// A ranked table: rank, name with an inline magnitude bar, then numeric columns.
// `cols` are {label, width, cell} so the header and body stay in lockstep — the
// fixed layout needs the widths declared once, on the header row.
function rankedTable(caption, rows, valueOf, labelOf, subOf, cols) {
  if (!rows.length) return '<table class="ranked"><thead><tr><th>' + esc(caption) +
    '</th></tr></thead><tbody><tr><td style="color:var(--muted)">Nothing in this period.</td></tr></tbody></table>';
  const max = Math.max(1, ...rows.map(valueOf));
  const head = '<thead><tr><th style="width:24px"></th><th>' + esc(caption) + '</th>' +
    cols.map(c => '<th class="num" style="width:' + c.width + '">' + esc(c.label) + '</th>').join('') +
    '</tr></thead>';
  const body = rows.map((r, i) => '<tr>' +
    '<td class="num" style="color:var(--muted)">' + (i + 1) + '</td>' +
    '<td class="bar"><div class="nm" title="' + esc(labelOf(r)) + '">' + esc(labelOf(r)) + '</div>' +
      (subOf ? '<div class="nm" style="font-size:10.5px;color:var(--muted)">' + esc(subOf(r)) + '</div>' : '') +
      '<i style="width:' + f1(valueOf(r) / max * 100) + '%"></i></td>' +
    cols.map(c => '<td class="num">' + c.cell(r) + '</td>').join('') + '</tr>').join('');
  return '<table class="ranked rank-tbl">' + head + '<tbody>' + body + '</tbody></table>';
}

function applyNonDateFilters(rows, f, kind) {
  const q = (f.search || '').trim().toLowerCase();
  if (!q && !f.type) return rows;
  return rows.filter(r => {
    if (f.type && kind !== 'items' && r.type !== f.type) return false;
    if (!q) return true;
    if (kind === 'items') return (r.code + ' ' + r.desc + ' ' + r.supplier + ' ' + r.ref).toLowerCase().includes(q);
    if (kind === 'breakup') return (r.customer + ' ' + r.ref + ' ' + r.license + ' ' + r.code + ' ' + r.desc + ' ' + r.vehicle).toLowerCase().includes(q);
    return (r.customer + ' ' + r.ref + ' ' + r.license).toLowerCase().includes(q);
  });
}

function renderDashboardTab() {
  const f = currentFilters();
  const sales = applyNonDateFilters(rowsOf('sales'), f, 'sales');
  const brk = applyNonDateFilters(rowsOf('breakup'), f, 'breakup');
  const items = applyNonDateFilters(rowsOf('items'), f, 'items');
  const range = effectiveRange();
  const today = new Date();
  const printedStr = fmtDateMdy(today.getFullYear(), today.getMonth() + 1, today.getDate());
  const scopeBits = [];
  if (state.type) scopeBits.push(esc(state.type) + 's only');
  if (state.search) scopeBits.push('matching “' + esc(state.search) + '”');

  if (!sales.length) {
    $('sheet').innerHTML = '<div class="dash"><h1 class="dash-head">Sales Dashboard</h1>' +
      '<p class="dash-sub">' + rangeLabel() + '</p>' +
      '<div class="notice"><b>No transactions to analyse.</b>' +
      (rowsOf('sales').length
        ? 'Nothing matches the current search or type filter. Clear them to see the full picture.'
        : 'The dashboard is driven by the <strong>Sales Report</strong> export — import it to see trends and comparisons.') +
      '</div></div>';
    renderCards([]);
    return;
  }

  const cov = coverageOf(sales);
  const series = monthlySeries(sales, cov);
  const partial = partialMonthSet(cov);
  const partialYears = partialYearSet(cov);
  const cmp = periodComparison(sales, range, state.period, cov);
  const cur = cmp.current;
  const selFromMk = mkOfDateKey(dateKeyOfPoint(range.from));
  const selToMk = mkOfDateKey(dateKeyOfPoint(range.to));

  /* --- notices: the things that would otherwise produce a false reading --- */
  let notices = '';
  if (cmp.truncated) {
    const t = cmp.to;
    notices += '<div class="notice"><b>This period is still incomplete.</b>' +
      'Data runs to ' + fmtDateMdy(t.y, t.mo, t.d) + ', so every comparison below measures the same ' +
      'part-period a year earlier (and the equivalent earlier window) rather than a whole one. ' +
      'Comparing it against a full month or year would understate it badly.</div>';
  }
  const brkPoint = marginBreakDetect(series);
  if (brkPoint) {
    notices += '<div class="notice"><b>Cost data changes in ' + MONTH_ABBR[mkMonth(brkPoint.mk) - 1] + ' ' + mkYear(brkPoint.mk) + '.</b>' +
      'Before then, recorded cost averages ' + (brkPoint.beforeRatio * 100).toFixed(0) + '% of revenue; after, ' +
      (brkPoint.afterRatio * 100).toFixed(0) + '%. That is a bookkeeping change, not a collapse in margin — ' +
      'treat profit and GP% before ' + mkYear(brkPoint.mk) + ' as overstated, and compare margins only within the later period.</div>';
  }

  /* --- KPI row --- */
  const idxOfSel = series.findIndex(s => s.mk === selToMk);
  const sparkEnd = idxOfSel >= 0 ? idxOfSel : series.length - 1;
  const sparkFrom = Math.max(0, sparkEnd - 11);
  const sparkSlice = series.slice(sparkFrom, sparkEnd + 1);
  const sparkCur = sparkSlice.length - 1;
  const spark = fld => sparkColumns(sparkSlice.map(s => s[fld]), sparkCur);
  const P = cmp.prev, L = cmp.lastYear;
  const kpi = (k, v, neg, dA, dB, sp) =>
    '<div class="kpi"><div class="k">' + k + '</div><div class="v' + (neg ? ' neg' : '') + '">' + v + '</div>' +
    '<div class="deltas">' + dA + dB + '</div>' + (sp || '') + '</div>';
  const kpis = '<div class="kpis">' +
    kpi('Revenue (Ex HST)', locMoney(cur.exHst), cur.exHst < 0,
      deltaHtml(cur.exHst, P && P.exHst, cmp.prevLabel), deltaHtml(cur.exHst, L && L.exHst, cmp.lastYearLabel), spark('exHst')) +
    kpi('Profit', locMoney(cur.profit), cur.profit < 0,
      deltaHtml(cur.profit, P && P.profit, cmp.prevLabel), deltaHtml(cur.profit, L && L.profit, cmp.lastYearLabel), spark('profit')) +
    kpi('GP %', fmtGp(cur.gp) + '%', cur.gp < 0,
      deltaHtml(cur.gp, P && P.gp, cmp.prevLabel, 'pts'), deltaHtml(cur.gp, L && L.gp, cmp.lastYearLabel, 'pts'), spark('gp')) +
    kpi('Invoices', cur.n.toLocaleString('en-CA'), false,
      deltaHtml(cur.n, P && P.n, cmp.prevLabel), deltaHtml(cur.n, L && L.n, cmp.lastYearLabel), spark('n')) +
    kpi('Average invoice', locMoney(cur.avgInvoice), false,
      deltaHtml(cur.avgInvoice, P && P.avgInvoice, cmp.prevLabel), deltaHtml(cur.avgInvoice, L && L.avgInvoice, cmp.lastYearLabel), spark('avgInvoice')) +
    kpi('Customers served', cur.customers.toLocaleString('en-CA'), false,
      deltaHtml(cur.customers, P && P.customers, cmp.prevLabel), deltaHtml(cur.customers, L && L.customers, cmp.lastYearLabel), spark('customers')) +
    '</div>';

  /* --- side-by-side comparison table --- */
  const cmpRow = (label, get, fmt, mode) => {
    const c = get(cur), p = P ? get(P) : null, l = L ? get(L) : null;
    const d = (v) => {
      if (v == null) return '<td class="num">—</td>';
      if (mode === 'pts') {
        const x = c - v;
        return '<td class="num" style="color:' + (Math.abs(x) < 0.05 ? 'inherit' : x > 0 ? 'var(--up)' : 'var(--down)') + '">' +
          (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(1) + ' pts</td>';
      }
      const x = pctChange(c, v);
      if (x == null) return '<td class="num">—</td>';
      return '<td class="num" style="color:' + (Math.abs(x) < 0.05 ? 'inherit' : x > 0 ? 'var(--up)' : 'var(--down)') + '">' +
        (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(1) + '%</td>';
    };
    return '<tr><td>' + label + '</td><td class="num"><strong>' + fmt(c) + '</strong></td>' +
      '<td class="num">' + (p == null ? '—' : fmt(p)) + '</td>' + d(p) +
      '<td class="num">' + (l == null ? '—' : fmt(l)) + '</td>' + d(l) + '</tr>';
  };
  const cmpTable = '<table class="ranked"><thead><tr><th>Measure</th><th class="num">This period</th>' +
    '<th class="num">' + esc(cmp.prevLabel) + '</th><th class="num">Change</th>' +
    '<th class="num">' + esc(cmp.lastYearLabel) + '</th><th class="num">Change</th></tr></thead><tbody>' +
    cmpRow('Revenue (Ex HST)', a => a.exHst, locMoney) +
    cmpRow('Profit', a => a.profit, locMoney) +
    cmpRow('GP %', a => a.gp, v => fmtGp(v) + '%', 'pts') +
    cmpRow('Invoices', a => a.n, v => v.toLocaleString('en-CA')) +
    cmpRow('Average invoice', a => a.avgInvoice, locMoney) +
    cmpRow('Customers served', a => a.customers, v => v.toLocaleString('en-CA')) +
    '</tbody></table>';

  /* --- trend --- */
  const complete = series.filter(s => s.n > 0 && !partial.has(s.mk));
  const best = complete.slice().sort((a, b) => b.exHst - a.exHst)[0];
  const worst = complete.slice().sort((a, b) => a.exHst - b.exHst)[0];
  const trendTable = '<details class="tableview"><summary>Show the monthly figures as a table</summary>' +
    '<table class="ranked"><thead><tr><th>Month</th><th class="num">Invoices</th><th class="num">Revenue</th>' +
    '<th class="num">Profit</th><th class="num">GP%</th><th class="num">Avg invoice</th></tr></thead><tbody>' +
    series.slice().reverse().map(s => '<tr><td>' + MONTH_ABBR[s.mo - 1] + ' ' + s.y +
      (partial.has(s.mk) ? ' <span style="color:var(--muted)">(partial)</span>' : '') + '</td>' +
      '<td class="num">' + s.n + '</td><td class="num">' + fmtMoney(s.exHst) + '</td>' +
      '<td class="num">' + fmtMoney(s.profit) + '</td><td class="num">' + fmtGp(s.gp) + '</td>' +
      '<td class="num">' + fmtMoney(s.avgInvoice) + '</td></tr>').join('') +
    '</tbody></table></details>';

  const trendSec = '<div class="dash-sec"><h3>Revenue by month, ' + series[0].y + '–' + series[series.length - 1].y + '</h3>' +
    '<p class="why">The whole history, with the selected period picked out. ' +
    (best ? 'Best complete month: <strong>' + MONTH_ABBR[best.mo - 1] + ' ' + best.y + '</strong> at ' + locMoney(best.exHst) + '. ' : '') +
    (worst ? 'Quietest: <strong>' + MONTH_ABBR[worst.mo - 1] + ' ' + worst.y + '</strong> at ' + locMoney(worst.exHst) + '.' : '') +
    (partial.size ? ' Faded bars are part-months.' : '') + '</p>' +
    legendHtml([
      { color: 'var(--c-sel)', label: 'Selected period' },
      { color: 'var(--c-ctx)', label: 'Other months' },
      { color: 'var(--c-ref)', label: '3-month average', line: true },
    ]) +
    trendChart(series, 'exHst', selFromMk, selToMk, partial, true) + trendTable + '</div>';

  /* --- year over year --- */
  const grid = yearMonthGrid(series, 'exHst');
  const yoyTable = '<details class="tableview"><summary>Show the year-over-year figures as a table</summary>' +
    '<table class="ranked"><thead><tr><th>Month</th>' + grid.years.map(y => '<th class="num">' + y + '</th>').join('') +
    '<th class="num">' + grid.years[grid.years.length - 1] + ' vs ' + grid.years[grid.years.length - 2] + '</th></tr></thead><tbody>' +
    MONTH_ABBR.map((mn, i) => {
      const last = grid.byYear.get(grid.years[grid.years.length - 1])[i];
      const prevY = grid.years.length > 1 ? grid.byYear.get(grid.years[grid.years.length - 2])[i] : null;
      const ch = (last != null && prevY != null) ? pctChange(last, prevY) : null;
      return '<tr><td>' + mn + '</td>' + grid.years.map(y => {
        const v = grid.byYear.get(y)[i];
        return '<td class="num">' + (v == null ? '—' : fmtMoney(v)) + '</td>';
      }).join('') + '<td class="num" style="color:' + (ch == null ? 'inherit' : ch >= 0 ? 'var(--up)' : 'var(--down)') + '">' +
        (ch == null ? '—' : (ch >= 0 ? '+' : '−') + Math.abs(ch).toFixed(1) + '%') + '</td></tr>';
    }).join('') + '</tbody></table></details>';

  const yoySec = grid.years.length > 1 ? '<div class="dash-sec"><h3>Same month, year over year</h3>' +
    '<p class="why">Each calendar month side by side across ' + grid.years.length + ' years — the comparison that strips out seasonality. ' +
    (partialYears.size ? 'Note ' + [...partialYears].sort().join(' and ') + ' ' + (partialYears.size > 1 ? 'are' : 'is') + ' partial ' + (partialYears.size > 1 ? 'years' : 'year') + '.' : '') + '</p>' +
    legendHtml(grid.years.map(y => ({ color: yearColor(y, grid.years), label: String(y) }))) +
    yoyChart(grid, true) + yoyTable + '</div>' : '';

  /* --- seasonality --- */
  const seas = seasonalityIndex(series, partial, 'exHst');
  const seasKnown = seas.filter(s => s.index != null);
  const seasPeak = seasKnown.slice().sort((a, b) => b.index - a.index)[0];
  const seasLow = seasKnown.slice().sort((a, b) => a.index - b.index)[0];
  const seasSec = seasKnown.length >= 6 ? '<div class="dash-sec"><h3>Seasonal shape of the year</h3>' +
    '<p class="why">Every month indexed against its own year’s average, then averaged across years, so growth between years does not masquerade as season. ' +
    (seasPeak && seasLow ? '<strong>' + MONTH_ABBR[seasPeak.mo - 1] + '</strong> runs about ' + Math.round(seasPeak.index) +
      '% of an average month; <strong>' + MONTH_ABBR[seasLow.mo - 1] + '</strong> about ' + Math.round(seasLow.index) + '%.' : '') + '</p>' +
    seasonChart(seas) + '</div>' : '';

  /* --- category mix --- */
  let mixSec = '';
  if (brk.length) {
    const mix = categoryMixByYear(brk);
    const names = mix.length ? mix[0].cats.map(c => c.name) : [];
    const bars = mix.map(m => {
      const segs = m.cats.filter(c => c.share > 0).map(c => {
        const col = catColor(c.name, names.indexOf(c.name));
        const lbl = c.share >= 8 ? '<span style="color:' + inkOn(col) + ';font-size:10.5px;font-weight:700">' + c.share.toFixed(0) + '%</span>' : '';
        return '<div title="' + esc(c.name) + ': ' + locMoney(c.amount) + ' (' + c.share.toFixed(1) + '%)" style="width:' + c.share +
          '%;background:' + col + ';display:flex;align-items:center;justify-content:center;border-radius:2px">' + lbl + '</div>';
      }).join('');
      return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">' +
        '<div style="width:74px;font-size:11.5px;font-weight:700;text-align:right">' + m.y +
        (partialYears.has(m.y) ? '<span style="font-weight:400;color:var(--muted)"> ◦</span>' : '') + '</div>' +
        '<div style="flex:1;display:flex;gap:2px;height:26px">' + segs + '</div>' +
        '<div style="width:86px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums">' + locMoney(m.total) + '</div></div>';
    }).join('');
    const perCat = categoryTotalsInRange(brk, dateKeyOfPoint(range.from), dateKeyOfPoint(cmp.to));
    const mixTable = '<table class="ranked" style="margin-top:12px"><thead><tr><th>Category (selected period)</th>' +
      '<th class="num">Lines</th><th class="num">Revenue</th><th class="num">Share</th><th class="num">Profit</th><th class="num">GP%</th></tr></thead><tbody>' +
      perCat.cats.map((c, i) => '<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:' +
        catColor(c.name, names.indexOf(c.name)) + ';margin-right:7px"></i>' + esc(c.name) + '</td>' +
        '<td class="num">' + c.n.toLocaleString('en-CA') + '</td><td class="num">' + locMoney(c.amount) + '</td>' +
        '<td class="num">' + c.share.toFixed(1) + '%</td><td class="num">' + locMoney(c.profit) + '</td>' +
        '<td class="num">' + fmtGp(c.gp) + '</td></tr>').join('') + '</tbody></table>';
    mixSec = '<div class="dash-sec"><h3>What the money comes from</h3>' +
      '<p class="why">Share of line-item revenue by category, per year — watch the mix shift, because the categories do not earn alike. ' +
      'The table below is the selected period only.' + (partialYears.size ? ' ◦ marks a partial year.' : '') + '</p>' +
      legendHtml(names.map((n, i) => ({ color: catColor(n, i), label: n }))) + bars + mixTable + '</div>';
  }

  /* --- who and what --- */
  const tc = topCustomersInRange(sales, dateKeyOfPoint(range.from), dateKeyOfPoint(cmp.to), 10);
  const nvr = newVsReturning(sales, dateKeyOfPoint(range.from), dateKeyOfPoint(cmp.to));
  const custTable = rankedTable('Top customers this period', tc.rows, r => r.exHst, r => r.name, null, [
    { label: 'Inv', width: '44px', cell: r => r.n },
    { label: 'Revenue', width: '92px', cell: r => locMoney(r.exHst) },
  ]);

  let itemTable = '';
  if (items.length) {
    const ti = topItemsInRange(items, dateKeyOfPoint(range.from), dateKeyOfPoint(cmp.to), 10);
    itemTable = rankedTable('Top items this period', ti.rows, r => r.sell, r => r.desc || r.code, r => r.code, [
      { label: 'Qty', width: '44px', cell: r => fmtQty(r.qty) },
      { label: 'Revenue', width: '92px', cell: r => locMoney(r.sell) },
    ]);
  } else if (brk.length) {
    const map = new Map();
    for (const r of brk) {
      if (r.dateKey < dateKeyOfPoint(range.from) || r.dateKey > dateKeyOfPoint(cmp.to)) continue;
      let it = map.get(r.code);
      if (!it) { it = { code: r.code, desc: r.desc, n: 0, sell: 0 }; map.set(r.code, it); }
      it.n++; it.sell += r.amount;
    }
    const rows = [...map.values()].sort((a, b) => b.sell - a.sell).slice(0, 10);
    itemTable = rankedTable('Top line items this period', rows, r => r.sell, r => r.desc || r.code, r => r.code, [
      { label: 'Lines', width: '48px', cell: r => r.n },
      { label: 'Revenue', width: '92px', cell: r => locMoney(r.sell) },
    ]);
  }

  const whoSec = '<div class="dash-sec"><h3>Who and what drove the period</h3>' +
    '<p class="why">' + tc.customerCount.toLocaleString('en-CA') + ' customers served — ' +
    '<strong>' + nvr.fresh.toLocaleString('en-CA') + '</strong> of them new to the shop, ' +
    nvr.returning.toLocaleString('en-CA') + ' returning' +
    (tc.rows.length && cur.exHst ? '. The top 10 below are ' +
      (tc.rows.reduce((a, r) => a + r.exHst, 0) / cur.exHst * 100).toFixed(0) + '% of the period’s revenue.' : '.') + '</p>' +
    '<div class="dash-split"><div>' + custTable + '</div><div>' + itemTable + '</div></div></div>';

  /* --- attach rate: the upsell that is or is not happening --- */
  let attachSec = '';
  if (brk.length) {
    const at = attachRates(brk, dateKeyOfPoint(range.from), dateKeyOfPoint(cmp.to));
    if (at.tyreInvoices >= 5) {
      const rowsHtml = at.services.map(s =>
        '<tr><td>' + esc(s.key) + '</td>' +
        '<td class="bar" style="width:34%"><i style="width:' + f1(Math.min(100, s.rate)) + '%"></i></td>' +
        '<td class="num"><strong>' + s.rate.toFixed(1) + '%</strong></td>' +
        '<td class="num">' + s.n.toLocaleString('en-CA') + '</td>' +
        '<td class="num">' + locMoney(s.avgWith) + '</td>' +
        '<td class="num">' + locMoney(s.avgWithout) + '</td></tr>').join('');
      attachSec = '<div class="dash-sec"><h3>Attach rate on tire jobs</h3>' +
        '<p class="why">Of the <strong>' + at.tyreInvoices.toLocaleString('en-CA') + '</strong> invoices in this period that sold tires, ' +
        'how many also picked up each add-on. The last two columns compare the average tire invoice with and without it — ' +
        'bigger jobs naturally attract more add-ons, so read them as a size difference, not a promise.</p>' +
        '<table class="ranked"><thead><tr><th>Add-on</th><th></th><th class="num">Attach rate</th>' +
        '<th class="num">Invoices</th><th class="num">Avg with</th><th class="num">Avg without</th></tr></thead><tbody>' +
        rowsHtml + '</tbody></table></div>';
    }
  }

  /* --- vehicles (from the breakup export's Make/Model + plate columns) --- */
  let vehSec = '';
  if (brk.length) {
    const v = vehicleStats(brk, dateKeyOfPoint(range.from), dateKeyOfPoint(cmp.to), 12);
    // Repeat-visit rates only mean something over the whole history — inside a
    // single month almost every vehicle is a "one-visit" vehicle by definition.
    const vAll = vehicleStats(brk, null, null, 1);
    if (v.makes.length) {
      const makeTable = rankedTable('Make', v.makes, r => r.amount, r => r.make, null, [
        { label: 'Vehicles', width: '64px', cell: r => r.vehicles },
        { label: 'Visits', width: '56px', cell: r => r.visits },
        { label: 'Revenue', width: '92px', cell: r => locMoney(r.amount) },
        { label: 'Share', width: '56px', cell: r => (v.totalAmount ? (r.amount / v.totalAmount * 100).toFixed(1) : '0.0') + '%' },
      ]);
      vehSec = '<div class="dash-sec"><h3>Vehicles through the shop</h3>' +
        '<p class="why"><strong>' + v.vehicles.toLocaleString('en-CA') + '</strong> vehicles across ' +
        v.makeCount + ' makes in this period. Over the whole history, ' +
        vAll.vehicles.toLocaleString('en-CA') + ' vehicles averaged <strong>' + vAll.avgVisits.toFixed(1) +
        '</strong> visits each and ' + Math.round(vAll.repeatVehicles / Math.max(1, vAll.vehicles) * 100) +
        '% came back more than once. What rolls in decides what is worth stocking.</p>' + makeTable + '</div>';
    }
  }

  $('sheet').innerHTML = '<div class="dash">' +
    '<h1 class="dash-head">Sales Dashboard</h1>' +
    '<p class="dash-sub">' + esc(rangeLabel()) + ' &nbsp;·&nbsp; ' +
    fmtDateMdy(range.from.y, range.from.mo, range.from.d) + ' – ' + fmtDateMdy(cmp.to.y, cmp.to.mo, cmp.to.d) +
    (scopeBits.length ? ' &nbsp;·&nbsp; ' + scopeBits.join(' &nbsp;·&nbsp; ') : '') + '</p>' +
    notices + kpis +
    '<div class="dash-sec"><h3>This period against the ones that matter</h3>' +
    '<p class="why">The same measures beside the previous period and the same period a year earlier.</p>' +
    cmpTable + '</div>' +
    trendSec + yoySec + seasSec + mixSec + whoSec + attachSec + vehSec +
    '<div class="rpt-footer" style="margin-top:20px"><span>' + sales.length.toLocaleString('en-CA') +
    ' transactions on file · ' + fmtDateMdy(keyToDate(cov.minKey).y, keyToDate(cov.minKey).mo, keyToDate(cov.minKey).d) +
    ' → ' + fmtDateMdy(keyToDate(cov.maxKey).y, keyToDate(cov.maxKey).mo, keyToDate(cov.maxKey).d) +
    '</span><span>Date Printed: ' + printedStr + '</span></div>' +
    '</div>';

  renderCards([]);
}

function renderCards(cards) {
  $('summary').innerHTML = cards.map(c =>
    `<div class="card"><div class="k">${c.k}</div><div class="v${c.neg ? ' neg' : ''}">${c.v}</div><div class="s">${c.s}</div></div>`).join('');
}

function locMoney(v) {
  const r = Math.round(v * 100) / 100;
  return (r < 0 ? '-$' : '$') + Math.abs(r).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function renderReport() {
  if (!hasAnyData()) {
    $('sheet').innerHTML = `
      <div class="empty">
        <h2>No sales data loaded yet</h2>
        <p>Import the CSV exports of your point-of-sale reports to get started:</p>
        <p><strong>Sales Report</strong> · <strong>Sales Breakup Report</strong> · <strong>Item Sales Report</strong></p>
        <p>The file type is detected automatically. Everything stays in this browser — nothing is uploaded anywhere.</p>
        <div class="bigdrop">
          <strong>Drag &amp; drop your CSV file(s) here</strong>
          <p>or</p>
          <div class="actions">
            <button class="btn primary" id="btnImport2">Choose CSV files…</button>
          </div>
          <p style="margin-top:14px"><button class="linklike" id="btnDemo">…or try it with built-in demo data</button></p>
        </div>
      </div>`;
    $('btnImport2').addEventListener('click', () => $('fileInput').click());
    $('btnDemo').addEventListener('click', loadDemo);
    $('summary').innerHTML = '';
    $('datastrip').innerHTML = '';
    return;
  }
  if (state.tab === 'dashboard') renderDashboardTab();
  else if (state.tab === 'breakup') renderBreakupTab();
  else if (state.tab === 'items') renderItemsTab();
  else renderSalesTab();
  renderDatastrip();
}

function renderDatastrip() {
  const span = dataSpan();
  if (!span) { $('datastrip').innerHTML = ''; return; }
  const parts = DATASETS
    .filter(n => rowsOf(n).length)
    .map(n => `${DATASET_LABEL[n]}: ${rowsOf(n).length.toLocaleString('en-CA')}`);
  const files = [...new Set(DATASETS.flatMap(n => (store[n] ? store[n].files : [])).map(f => f.name))];
  $('datastrip').innerHTML =
    `<span><span class="dot"></span>${parts.join(' · ')} &nbsp;·&nbsp; ${fmtDateMdy(span.min.y, span.min.mo, span.min.d)} → ${fmtDateMdy(span.max.y, span.max.mo, span.max.d)}</span>
     <span title="${esc(files.join(', '))}">Sources: ${files.length} file${files.length === 1 ? '' : 's'}</span>
     ${persistable ? '' : '<span style="color:var(--bad)">⚠ not persisted in this browser</span>'}`;
}

/* ---------- controls ---------- */
function renderControls() {
  const has = hasAnyData();
  $('controls').style.display = has ? '' : 'none';
  $('tabsbar').style.display = has ? '' : 'none';
  $('btnExport').disabled = !has;
  $('btnClear').disabled = !has;
  $('btnPrint').disabled = !has;
  if (!has) return;

  document.querySelectorAll('#tabsbar button').forEach(b => b.classList.toggle('on', b.dataset.t === state.tab));
  $('cntSales').textContent = rowsOf('sales').length ? rowsOf('sales').length.toLocaleString('en-CA') : '';
  $('cntBreakup').textContent = rowsOf('breakup').length ? rowsOf('breakup').length.toLocaleString('en-CA') : '';
  $('cntItems').textContent = rowsOf('items').length ? rowsOf('items').length.toLocaleString('en-CA') : '';

  document.querySelectorAll('#segPeriod button').forEach(b => b.classList.toggle('on', b.dataset.p === state.period));
  document.querySelectorAll('#segView button').forEach(b => b.classList.toggle('on', b.dataset.v === state.view));
  $('fMonth').style.display = state.period === 'month' ? '' : 'none';
  $('fYearOnly').style.display = state.period === 'year' ? '' : 'none';
  $('fFrom').style.display = $('fTo').style.display = state.period === 'range' ? '' : 'none';

  $('fType').style.display = state.tab === 'items' ? 'none' : '';
  $('fView').style.display = state.tab === 'sales' ? '' : 'none';
  $('fCategory').style.display = state.tab === 'breakup' ? '' : 'none';
  $('fTotalsOnly').style.display = state.tab === 'breakup' ? '' : 'none';
  $('fSort').style.display = state.tab === 'items' ? '' : 'none';
  // The dashboard always draws the whole history for context, so "all data"
  // would leave nothing selected to compare — offer only real periods.
  $('segPeriod').querySelector('button[data-p="all"]').style.display = state.tab === 'dashboard' ? 'none' : '';

  const rows = allRows();
  const years = [...new Set(rows.map(r => r.y))].sort();
  const monthsWithData = new Set(rows.filter(r => r.y === state.y).map(r => r.mo));
  $('selMonth').innerHTML = MONTH_NAMES.map((n, i) =>
    `<option value="${i + 1}"${i + 1 === state.mo ? ' selected' : ''}>${n}${monthsWithData.has(i + 1) ? '' : ' —'}</option>`).join('');
  const yearOpts = years.map(y => `<option value="${y}"${y === state.y ? ' selected' : ''}>${y}</option>`).join('');
  $('selYear').innerHTML = yearOpts;
  $('selYear2').innerHTML = yearOpts;

  const types = [...new Set([...rowsOf('sales'), ...rowsOf('breakup')].map(r => r.type))].sort();
  $('selType').innerHTML = `<option value="">All types</option>` +
    types.map(t => `<option value="${esc(t)}"${t === state.type ? ' selected' : ''}>${esc(t)}s only</option>`).join('');

  const cats = [...new Set(rowsOf('breakup').map(r => r.category))].sort();
  $('selCategory').innerHTML = `<option value="">All categories</option>` +
    cats.map(c => `<option value="${esc(c)}"${c === state.category ? ' selected' : ''}>${esc(c)}</option>`).join('');
  $('selSort').value = state.itemSort;
  $('chkTotalsOnly').checked = state.totalsOnly;

  $('inpSearch').placeholder =
    state.tab === 'items' ? 'Item code, description, supplier…' :
    state.tab === 'breakup' ? 'Customer, item, license, vehicle…' :
    'Customer, ref # or license…';
  if (document.activeElement !== $('inpSearch')) $('inpSearch').value = state.search;
  $('dateFrom').value = state.from;
  $('dateTo').value = state.to;
}

function rerender() {
  ensureValidState();
  saveFilters();
  renderControls();
  renderReport();
}

function shiftMonth(delta) {
  let y = state.y, mo = state.mo + delta;
  if (mo < 1) { mo = 12; y--; }
  if (mo > 12) { mo = 1; y++; }
  state.y = y; state.mo = mo;
  rerender();
}

/* ---------- import / export ---------- */
function importFiles(fileList) {
  const files = [...fileList].filter(f => /\.csv$/i.test(f.name) || f.type === 'text/csv' || f.type === 'application/vnd.ms-excel');
  if (!files.length) { toast('Please choose a .csv file (a report export).'); return; }
  let done = 0;
  const results = [], failed = [], touched = new Set();
  for (const f of files) {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const rows = parseCsv(String(reader.result));
        const fmt = detectFormat(rows);
        const parsed = fmt === 'breakup' ? extractBreakup(rows) : fmt === 'items' ? extractItems(rows) : extractInvoices(rows);
        if (!parsed.length) failed.push(f.name);
        else {
          const res = mergeRows(fmt, parsed, f.name);
          touched.add(fmt);
          results.push(`${DATASET_LABEL[fmt]}: ${parsed.length.toLocaleString('en-CA')} rows (${res.added.toLocaleString('en-CA')} new)`);
        }
      } catch (e) { failed.push(f.name); }
      if (++done === files.length) {
        for (const name of touched) await saveDataset(name);
        if (results.length) {
          const span = dataSpan();
          if (span && state.period === 'month') { state.y = span.max.y; state.mo = span.max.mo; }
          if (touched.size === 1 && !rowsOf(TAB_NEEDS[state.tab] || state.tab).length) state.tab = [...touched][0];
          toast('Imported — ' + results.join(' · ') + (failed.length ? `. Could not read: ${failed.join(', ')}` : ''));
        } else {
          toast(`No report rows found in ${failed.join(', ') || 'the selected file(s)'} — expected a Sales, Sales Breakup or Item Sales CSV export.`);
        }
        rerender();
      }
    };
    reader.onerror = () => { failed.push(f.name); if (++done === files.length) rerender(); };
    reader.readAsText(f);
  }
}

function exportFiltered() {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  let lines, nameHint;
  if (state.tab === 'dashboard') {
    // Export the monthly series the dashboard is built on, so it can be
    // pivoted or charted elsewhere.
    const f = currentFilters();
    const sales = applyNonDateFilters(rowsOf('sales'), f, 'sales');
    const cov = coverageOf(sales);
    const series = monthlySeries(sales, cov);
    const partial = partialMonthSet(cov);
    lines = [['Year', 'Month', 'Partial', 'Invoices', 'Customers', 'Ex HST', 'HST', 'D/C', 'Total', 'Cost Ex. HST', 'Profit', 'GP%', 'Avg invoice'].join(',')];
    for (const s of series) {
      lines.push([s.y, MONTH_ABBR[s.mo - 1], partial.has(s.mk) ? 'yes' : 'no', s.n, s.customers,
        s.exHst.toFixed(2), s.hst.toFixed(2), s.dc.toFixed(2), s.total.toFixed(2),
        s.cost.toFixed(2), s.profit.toFixed(2), fmtGp(s.gp), s.avgInvoice.toFixed(2)].join(','));
    }
    nameHint = 'sales-by-month-';
  } else if (state.tab === 'breakup') {
    const rep = buildBreakupReport(rowsOf('breakup'), currentFilters());
    lines = [['Category', 'Ref', 'Date', 'Type', 'Customer', 'License', 'Make/Model', 'Item Code', 'Description', 'Amount', 'Cost Ex.', 'HST', 'Profit'].join(',')];
    for (const c of rep.cats) for (const r of c.rows) {
      lines.push([q(c.name), r.ref, fmtDateMdy(r.y, r.mo, r.d), q(r.type), q(r.customer), q(r.license), q(r.vehicle), q(r.code), q(r.desc),
        r.amount.toFixed(2), r.cost.toFixed(2), r.hst.toFixed(2), r.profit.toFixed(2)].join(','));
    }
    nameHint = 'sales-breakup-';
  } else if (state.tab === 'items') {
    const rep = buildItemsReport(rowsOf('items'), currentFilters());
    lines = [['Item Code', 'Description', 'Supplier', 'Sales', 'Qty', 'Revenue', 'Cost', 'Profit', 'Margin%'].join(',')];
    for (const it of rep.items) {
      lines.push([q(it.code), q(it.desc), q(it.supplier), it.n, fmtQty(it.qty),
        it.sell.toFixed(2), it.cost.toFixed(2), it.profit.toFixed(2), fmtGp(it.margin)].join(','));
    }
    nameHint = 'item-sales-';
  } else {
    const rep = buildReport(rowsOf('sales'), currentFilters());
    const rows = rep.groups ? rep.groups.flatMap(g => g.rows) : rep.rows;
    lines = [['Ref', 'Date', 'Type', 'Customer', 'Service Advisor', 'License', 'Ex HST', 'HST', 'D/C', 'Total', 'Cost Ex. HST', 'Profit', 'GP%'].join(',')];
    for (const r of rows) {
      lines.push([r.ref, fmtDateMdy(r.y, r.mo, r.d), q(r.type), q(r.customer), q(r.advisor), q(r.license),
        r.exHst.toFixed(2), r.hst.toFixed(2), r.dc.toFixed(2), r.total.toFixed(2), r.cost.toFixed(2), r.profit.toFixed(2),
        fmtGp(gpPercent(r.exHst, r.dc, r.profit))].join(','));
    }
    nameHint = 'sales-report-';
  }
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (nameHint + rangeLabel().toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.csv').replace(/-+/g, '-');
  a.click();
  URL.revokeObjectURL(a.href);
}

async function clearData() {
  if (!confirm('Remove all imported sales data from this browser? Your original CSV files are not affected.')) return;
  store = { sales: null, breakup: null, items: null };
  await idbClear();
  try { localStorage.removeItem(LEGACY_KEY); } catch (e) { /* ignore */ }
  rerender();
}

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}

/* Built-in demo: a few hand-written rows show the import format (they are also
   in sample-data/), but the dashboard needs years of history to show anything.
   So the demo button synthesises a fictional but realistically-shaped shop —
   deterministic, so everyone sees the same numbers. No real customer data. */
const DEMO_FIRST = ['Alex','Brigitte','Carlos','Dana','Émile','Farah','Grant','Hélène','Ibrahim','Jodie',
  'Karim','Lucie','Marcus','Nadia','Owen','Priya','Quentin','Rosa','Samir','Tessa','Umar','Véronique','Wes','Yara'];
const DEMO_LAST = ['Arsenault','Bouchard','Chen','Dubois','Ellis','Fontaine','Gagnon','Haddad','Irving','Joly',
  'Kowalski','Lemieux','Moreau','Nguyen','O’Brien','Patel','Quesnel','Rivard','Sauvé','Tremblay','Ukwu','Vachon'];
const DEMO_MAKES = [['HONDA','CIVIC'],['TOYOTA','COROLLA'],['HYUNDAI','ELANTRA'],['FORD','F150'],['MAZDA','CX-5'],
  ['NISSAN','ROGUE'],['KIA','FORTE'],['SUBARU','OUTBACK'],['VOLKSWAGEN','JETTA'],['CHEVROLET','EQUINOX']];
const DEMO_SERVICES = [
  { code: 'LABOUR', desc: 'Brake Pads & Rotors R&R', cat: 'LABOUR', lo: 180, hi: 520, margin: 0.55 },
  { code: 'LABOUR', desc: 'Oil Change Service', cat: 'LABOUR', lo: 45, hi: 95, margin: 0.60 },
  { code: 'LABOUR', desc: 'Suspension Control Arm R&R', cat: 'LABOUR', lo: 220, hi: 680, margin: 0.52 },
  { code: 'LABOUR', desc: 'Seasonal Tire Changeover', cat: 'LABOUR', lo: 60, hi: 110, margin: 0.70 },
  { code: 'ALIGN', desc: 'Wheel Alignment', cat: 'LABOUR', lo: 95, hi: 145, margin: 0.58 },
  { code: 'TIRE_NOR', desc: 'All-Season Tire (set of 4)', cat: 'TIRES', lo: 520, hi: 1450, margin: 0.24 },
  { code: 'TIRE_WIN', desc: 'Winter Tire (set of 4)', cat: 'TIRES', lo: 640, hi: 1680, margin: 0.22 },
  { code: 'BRAKEPAD', desc: 'Ceramic Brake Pad Set', cat: 'STOCK', lo: 85, hi: 260, margin: 0.45 },
  { code: 'BATTERY', desc: 'Replacement Battery', cat: 'STOCK', lo: 160, hi: 340, margin: 0.38 },
  { code: 'FILTERKIT', desc: 'Filter & Fluid Kit', cat: 'STOCK', lo: 40, hi: 130, margin: 0.50 },
  { code: 'MISCSUPPLIES', desc: 'Shop Supplies', cat: 'CONSUMABLES', lo: 5, hi: 14, margin: 1 },
  { code: 'DISPFEE', desc: 'Environmental Disposal Fee', cat: 'CONSUMABLES', lo: 3, hi: 12, margin: 1 },
];
// Mirrors a Canadian tire shop's real shape: Nov and Apr changeover peaks, Feb trough.
const DEMO_SEASON = [0.72, 0.51, 0.58, 1.35, 1.28, 1.05, 1.02, 0.88, 0.66, 1.26, 1.56, 1.02];

function buildDemoData() {
  let seed = 20260917;                       // fixed: everyone sees the same demo
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const between = (lo, hi) => lo + rnd() * (hi - lo);

  const customers = [];
  for (let i = 0; i < 150; i++) {
    const mk = DEMO_MAKES[Math.floor(rnd() * DEMO_MAKES.length)];
    customers.push({
      name: pick(DEMO_FIRST) + ' ' + pick(DEMO_LAST),
      plate: String.fromCharCode(65 + Math.floor(rnd() * 26), 65 + Math.floor(rnd() * 26),
        65 + Math.floor(rnd() * 26), 65 + Math.floor(rnd() * 26)) + String(100 + Math.floor(rnd() * 900)),
      make: mk[0], model: mk[1],
    });
  }
  customers.push({ name: 'Rideau Valley Fleet Services', plate: 'FLEET01', make: 'FORD', model: 'TRANSIT' });
  customers.push({ name: 'Orleans Courier Co.', plate: 'FLEET02', make: 'NISSAN', model: 'NV200' });

  const sales = [], breakup = [], items = [];
  let ref = 40000;
  // Three full years plus a deliberately part-finished month, so the demo also
  // shows how the dashboard handles an incomplete period.
  const months = [];
  for (let y = 2023; y <= 2025; y++) for (let m = 1; m <= 12; m++) months.push([y, m, daysInMonth(y, m)]);
  months.push([2026, 1, 31], [2026, 2, 28], [2026, 3, 12]);

  for (const [y, mo, lastDay] of months) {
    const growth = Math.pow(1.08, (y - 2023) + (mo - 1) / 12);
    const count = Math.round(between(20, 26) * DEMO_SEASON[mo - 1] * growth * (lastDay / daysInMonth(y, mo)));
    for (let i = 0; i < count; i++) {
      const c = customers[Math.floor(Math.pow(rnd(), 1.7) * customers.length)];  // a few regulars dominate
      const d = 1 + Math.floor(rnd() * lastDay);
      const dateKey = dateKeyOf(y, mo, d);
      const nLines = 1 + Math.floor(rnd() * 4);
      let exHst = 0, cost = 0;
      const myRef = String(++ref);
      const winter = mo >= 10 || mo <= 3;
      for (let L = 0; L < nLines; L++) {
        let svc = DEMO_SERVICES[Math.floor(rnd() * DEMO_SERVICES.length)];
        if (svc.code === 'TIRE_WIN' && !winter) svc = DEMO_SERVICES[5];
        if (svc.code === 'TIRE_NOR' && winter && rnd() < 0.6) svc = DEMO_SERVICES[6];
        const amount = Math.round(between(svc.lo, svc.hi) * 100) / 100;
        const lineCost = Math.round(amount * (1 - svc.margin) * 100) / 100;
        exHst += amount; cost += lineCost;
        breakup.push({
          ref: myRef, y, mo, d, dateKey, category: svc.cat, code: svc.code, desc: svc.desc,
          type: 'Invoice', customer: c.name, license: c.plate, vehicle: c.make + ' ' + c.model,
          amount, cost: lineCost, hst: Math.round(amount * 13) / 100, profit: Math.round((amount - lineCost) * 100) / 100,
          id: myRef + '|' + dateKey + '|' + svc.code + '|' + amount + '#' + (L + 1),
        });
        if (svc.cat === 'TIRES' || svc.cat === 'STOCK') {
          const qty = svc.cat === 'TIRES' ? 4 : 1;
          items.push({
            ref: myRef, y, mo, d, dateKey, code: svc.code, advisor: '', desc: svc.desc,
            supplier: svc.cat === 'TIRES' ? 'Demo Tire Supply' : 'Demo Parts Co',
            qty, sell: amount, unitCost: Math.round(lineCost / qty * 100) / 100, cost: lineCost,
            id: myRef + '|' + dateKey + '|' + svc.code + '|' + amount + '#1',
          });
        }
      }
      exHst = Math.round(exHst * 100) / 100;
      cost = Math.round(cost * 100) / 100;
      const dc = rnd() < 0.06 ? Math.round(exHst * between(0.05, 0.15) * 100) / 100 : 0;
      const hst = Math.round((exHst - dc) * 13) / 100;
      sales.push({
        ref: myRef, y, mo, d, dateKey, type: 'Invoice', customer: c.name, advisor: '', license: c.plate,
        exHst, hst, dc, total: Math.round((exHst + hst - dc) * 100) / 100,
        cost, profit: Math.round((exHst - dc - cost) * 100) / 100,
      });
    }
  }
  return { sales, breakup, items };
}

async function loadDemo() {
  const demo = buildDemoData();
  mergeRows('sales', demo.sales, 'Demo data (built-in)');
  mergeRows('breakup', demo.breakup, 'Demo data (built-in)');
  mergeRows('items', demo.items, 'Demo data (built-in)');
  for (const n of DATASETS) await saveDataset(n);
  const span = dataSpan();
  if (span) { state.y = span.max.y; state.mo = span.max.mo; }
  toast('Demo data loaded — ' + demo.sales.length.toLocaleString('en-CA') +
    ' fictional invoices over three years. Not real customers.');
  rerender();
}

/* ---------- wiring ---------- */
async function init() {
  await loadStore();
  loadFilters();

  $('btnImport').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => { importFiles(e.target.files); e.target.value = ''; });
  $('btnPrint').addEventListener('click', () => {
    const old = document.title;
    document.title = TAB_TITLE[state.tab] + ' — ' + rangeLabel();
    window.print();
    setTimeout(() => { document.title = old; }, 500);
  });
  $('btnExport').addEventListener('click', exportFiltered);
  $('btnClear').addEventListener('click', clearData);

  $('tabsbar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.tab = b.dataset.t; rerender();
  });
  $('segPeriod').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.period = b.dataset.p; rerender();
  });
  $('segView').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.v; rerender();
  });
  $('prevMonth').addEventListener('click', () => shiftMonth(-1));
  $('nextMonth').addEventListener('click', () => shiftMonth(1));
  $('selMonth').addEventListener('change', e => { state.mo = +e.target.value; rerender(); });
  $('selYear').addEventListener('change', e => { state.y = +e.target.value; rerender(); });
  $('selYear2').addEventListener('change', e => { state.y = +e.target.value; rerender(); });
  $('selType').addEventListener('change', e => { state.type = e.target.value; rerender(); });
  $('selCategory').addEventListener('change', e => { state.category = e.target.value; rerender(); });
  $('selSort').addEventListener('change', e => { state.itemSort = e.target.value; rerender(); });
  $('chkTotalsOnly').addEventListener('change', e => { state.totalsOnly = e.target.checked; rerender(); });
  $('dateFrom').addEventListener('change', e => { state.from = e.target.value; rerender(); });
  $('dateTo').addEventListener('change', e => { state.to = e.target.value; rerender(); });
  let searchTimer;
  $('inpSearch').addEventListener('input', e => {
    const v = e.target.value;   // capture now — the field may be re-rendered before the debounce fires
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.search = v; rerender(); }, 180);
  });

  // Whole-window drag & drop.
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) $('dropOverlay').classList.add('on'); });
  window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; $('dropOverlay').classList.remove('on'); } });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; $('dropOverlay').classList.remove('on');
    if (e.dataTransfer && e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
  });

  rerender();
}

init();
</script>
</body>
</html>
