<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIRE+ Orleans — Sales Reports</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23d61f26'/><circle cx='50' cy='50' r='20' fill='white'/></svg>">
<style>
  :root {
    --brand: #d61f26;
    --ink: #1b1d21;
    --muted: #6b7280;
    --bg: #eef0f3;
    --panel: #ffffff;
    --border: #d8dbe1;
    --soft: #f6f7f9;
    --good: #0f7b3d;
    --bad: #b42318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---------- App chrome (never printed) ---------- */
  .appbar {
    background: #17191d;
    color: #fff;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .brand .tire { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
  .brand .plus { color: var(--brand); font-weight: 800; font-size: 19px; }
  .brand .loc { color: #b7bcc5; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
  .appbar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border);
    background: #fff; color: var(--ink);
    border-radius: 8px; padding: 7px 14px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: #b8161d; }
  .btn.ghost { background: transparent; border-color: #3a3e46; color: #e6e8ec; }
  .btn.ghost:hover { background: #262a30; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .tabsbar {
    background: #fff; border-bottom: 1px solid var(--border);
    display: flex; gap: 4px; padding: 0 18px;
    position: sticky; top: 51px; z-index: 19;
    overflow-x: auto;
  }
  .tabsbar button {
    border: 0; background: none; cursor: pointer;
    padding: 11px 14px 9px; font-size: 13.5px; font-weight: 700; color: var(--muted);
    border-bottom: 3px solid transparent; white-space: nowrap;
  }
  .tabsbar button.on { color: var(--ink); border-bottom-color: var(--brand); }
  .tabsbar button .cnt { font-weight: 600; color: var(--muted); font-size: 11.5px; margin-left: 4px; }

  .controls {
    max-width: 1240px; margin: 16px auto 0; padding: 0 16px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .field select, .field input[type="date"], .field input[type="search"] {
    border: 1px solid var(--border); border-radius: 8px;
    background: #fff; color: var(--ink);
    padding: 7px 9px; font-size: 13px; min-height: 34px;
  }
  .field input[type="search"] { width: 230px; }
  .checkline { display: flex; align-items: center; gap: 6px; min-height: 34px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button {
    border: 0; background: transparent; padding: 7px 12px;
    font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--ink); color: #fff; }
  .monthnav { display: inline-flex; align-items: center; gap: 6px; }
  .monthnav .btn { padding: 7px 10px; }

  .summary {
    max-width: 1240px; margin: 14px auto 0; padding: 0 16px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px;
  }
  .card .k { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .card .v { font-size: 20px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .s { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .card .v.neg { color: var(--bad); }

  .paper-wrap { max-width: 1240px; margin: 16px auto 60px; padding: 0 16px; }
  .sheet {
    background: #fff; border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 2px 14px rgba(15, 17, 20, .08);
    padding: 34px 36px 28px;
    overflow-x: auto;
  }

  /* ---------- The report (screen + print) ---------- */
  .rpt-title { text-align: center; font-size: 21px; font-weight: 800; margin: 0 0 2px; }
  .rpt-range { text-align: center; font-size: 13px; margin: 0 0 16px; }
  .rpt-note { text-align: center; font-size: 12px; color: var(--muted); margin: -10px 0 14px; }
  .rpt-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 940px; }
  .rpt-table th {
    text-align: left; font-weight: 700; font-size: 11px;
    border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
    padding: 5px 5px; white-space: nowrap;
  }
  .rpt-table td { padding: 4px 5px; vertical-align: top; }
  .rpt-table .num, .rpt-table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rpt-table tbody.grp tr.inv:nth-child(even) td { background: #fafbfc; }
  .rpt-table td.neg { color: var(--bad); }
  tr.cust-name td { font-weight: 700; padding-top: 8px; font-size: 12.5px; }
  tr.subtotal td { font-weight: 700; border-top: 1px solid #9aa0aa; border-bottom: 1px solid #e3e5ea; }
  tr.subtotal td.lbl { text-align: right; }
  tr.grand td { font-weight: 800; border-top: 2px solid var(--ink); border-bottom: 2.5px double var(--ink); font-size: 12.5px; padding-top: 6px; padding-bottom: 6px; }
  tr.grand td.lbl { text-align: right; }
  .rpt-footer { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 14px; }
  .rpt-empty { text-align: center; color: var(--muted); padding: 30px 0 20px; font-size: 14px; }

  /* ---------- Empty state / drop zone ---------- */
  .empty { text-align: center; padding: 60px 20px 70px; }
  .empty h2 { margin: 0 0 6px; font-size: 20px; }
  .empty p { margin: 4px 0; color: var(--muted); }
  .empty .bigdrop {
    margin: 22px auto 0; max-width: 560px;
    border: 2px dashed #b9bfc9; border-radius: 14px;
    padding: 36px 24px; background: var(--soft);
  }
  .empty .bigdrop strong { font-size: 15px; }
  .empty .actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
  .linklike { background: none; border: none; color: var(--brand); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; }

  .drop-overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(23, 25, 29, .82); color: #fff;
    align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    border: 6px dashed rgba(255,255,255,.5);
  }
  .drop-overlay.on { display: flex; }

  .datastrip {
    max-width: 1240px; margin: 10px auto 0; padding: 0 16px;
    font-size: 12px; color: var(--muted);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .datastrip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 5px; }

  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #17191d; color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 60;
    max-width: 80vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Dashboard ----------
     Chart colors are the validated data-viz palette, not the brand red: red
     stays reserved for "negative" so a bar never reads as an alarm.
     Years use an ordinal one-hue ramp (older = lighter); categories use fixed
     categorical slots keyed to the category NAME, so filtering never repaints. */
  .dash {
    --c-sel: #2a78d6;        /* selected period          (blue 450) */
    --c-ctx: #b7d3f6;        /* context months           (blue 150) */
    --c-ref: #52514e;        /* reference line / avg     (secondary ink) */
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --muted-ink: #898781;
    --up: #006300;
    --down: #b42318;
    print-color-adjust: exact; -webkit-print-color-adjust: exact;
  }
  .dash-head { margin: 0 0 4px; font-size: 21px; font-weight: 800; text-align: center; }
  .dash-sub { text-align: center; font-size: 13px; color: var(--muted); margin: 0 0 18px; }

  .notice {
    border: 1px solid #e6d9a8; background: #fdf8e8; border-radius: 9px;
    padding: 10px 13px; margin: 0 0 16px; font-size: 12.5px; line-height: 1.5;
  }
  .notice b { display: block; margin-bottom: 2px; }
  .notice + .notice { margin-top: -8px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .kpi { border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px 9px; }
  .kpi .k { font-size: 10.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .kpi .v { font-size: 23px; font-weight: 800; margin: 2px 0 1px; line-height: 1.1; }
  .kpi .v.neg { color: var(--down); }
  .kpi .deltas { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; margin-top: 3px; }
  .kpi .d { white-space: nowrap; color: var(--muted); }
  .kpi .d b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi .d.up b { color: var(--up); }
  .kpi .d.down b { color: var(--down); }
  .kpi .spark { display: block; margin-top: 6px; }

  .dash-sec { margin-top: 26px; }
  .dash-sec > h3 {
    font-size: 14px; font-weight: 800; margin: 0 0 1px;
    border-top: 1px solid var(--border); padding-top: 14px;
  }
  .dash-sec > p.why { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  .dash-sec.first > h3 { border-top: 0; padding-top: 0; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 8px; font-size: 11.5px; color: var(--ink); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .legend i.line { height: 2px; border-radius: 1px; width: 15px; }

  .chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { font-family: inherit; }
  .tick { font-size: 10px; fill: var(--muted-ink); }
  .tick.b { font-weight: 700; fill: var(--muted); }
  .vlabel { font-size: 10px; font-weight: 700; fill: var(--ink); }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .baseline { stroke: var(--axis); stroke-width: 1; }

  .dash-split { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  @media (max-width: 860px) { .dash-split { grid-template-columns: 1fr; } }

  .ranked { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ranked th {
    text-align: left; font-size: 10.5px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px;
    border-bottom: 1px solid var(--border); padding: 0 6px 5px;
  }
  .ranked td { padding: 4px 6px; border-bottom: 1px solid #f1f2f4; vertical-align: middle; }
  .ranked td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ranked .bar { position: relative; }
  .ranked .bar i {
    display: block; height: 4px; border-radius: 2px; background: var(--c-sel); margin-top: 3px;
  }
  /* Fixed layout is what makes the ellipsis work: without it the name cell
     sizes to its content and the truncation collapses the text entirely. */
  .ranked.rank-tbl { table-layout: fixed; }
  .ranked .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  details.tableview { margin-top: 10px; }
  details.tableview > summary {
    cursor: pointer; font-size: 11.5px; color: var(--muted); font-weight: 600;
    list-style: revert; padding: 2px 0;
  }
  details.tableview > summary:hover { color: var(--ink); }
  details.tableview .ranked { margin-top: 8px; }

  /* ---------- Print ---------- */
  @page { size: A4 portrait; margin: 12mm 9mm 12mm; }
  @media print {
    body { background: #fff; }
    .no-print, #toast, .drop-overlay { display: none !important; }
    .paper-wrap { max-width: none; margin: 0; padding: 0; }
    .sheet { border: 0; box-shadow: none; border-radius: 0; padding: 0; overflow: visible; }
    .rpt-table { font-size: 8.6px; min-width: 0; }
    .rpt-table th { font-size: 8.4px; padding: 3px 3px; }
    .rpt-table td { padding: 2.4px 3px; }
    tr.cust-name td { font-size: 8.8px; padding-top: 5px; }
    tr.grand td { font-size: 8.8px; }
    .rpt-table tbody.grp tr.inv:nth-child(even) td { background: none; }
    .rpt-table td.neg { color: #000; }
    .rpt-title { font-size: 16px; }
    .rpt-range { font-size: 10.5px; margin-bottom: 10px; }
    .rpt-note { font-size: 9px; margin: -6px 0 8px; color: #000; }
    .rpt-footer { font-size: 8.5px; color: #000; }
    thead { display: table-header-group; }
    tbody.grp { page-break-inside: avoid; break-inside: avoid; }
    tr { page-break-inside: avoid; break-inside: avoid; }
    tbody.grp.big { page-break-inside: auto; break-inside: auto; }

    /* Dashboard in print: keep each section whole on one page. */
    .dash-head { font-size: 16px; }
    .dash-sub { font-size: 10.5px; margin-bottom: 12px; }
    .dash-sec { page-break-inside: avoid; break-inside: avoid; margin-top: 16px; }
    .dash-sec > h3 { font-size: 11px; padding-top: 9px; }
    .dash-sec > p.why { font-size: 9px; margin-bottom: 6px; }
    .kpis { grid-template-columns: repeat(6, 1fr); gap: 5px; page-break-inside: avoid; break-inside: avoid; }
    .kpi { padding: 6px 7px 5px; }
    .kpi .k { font-size: 7px; letter-spacing: .3px; }
    .kpi .v { font-size: 13px; }
    .kpi .deltas { font-size: 7.5px; gap: 5px; }
    .kpi .spark { display: none; }
    .notice { font-size: 9px; padding: 7px 9px; page-break-inside: avoid; break-inside: avoid; }
    .legend { font-size: 8.5px; gap: 9px; }
    .tick { font-size: 7.5px; }
    .vlabel { font-size: 7.5px; }
    .ranked { font-size: 8.5px; }
    .ranked th { font-size: 7.5px; }
    .ranked td { padding: 2px 4px; }
    .dash-split { gap: 12px; }
    details.tableview > summary { display: none; }
    details.tableview[open] { page-break-inside: avoid; break-inside: avoid; }
  }
</style>
</head>
<body>

<header class="appbar no-print">
  <div class="brand">
    <span class="tire">TIRE<span class="plus">+</span></span>
    <span class="loc">Orleans · Sales Reports</span>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnImport" title="Import CSV exports — Sales / Sales Breakup / Item Sales reports, or invoice / invoiceItem / product tables">⬆ Import CSV</button>
  <button class="btn ghost" id="btnExport" title="Download the current view as a clean CSV">⬇ Export filtered</button>
  <button class="btn ghost danger" id="btnClear" title="Remove all imported data from this browser">Clear data</button>
  <button class="btn primary" id="btnPrint">🖨 Print report</button>
</header>

<nav class="tabsbar no-print" id="tabsbar">
  <button data-t="dashboard">📊 Dashboard</button>
  <button data-t="sales">Sales report<span class="cnt" id="cntSales"></span></button>
  <button data-t="breakup">Categories<span class="cnt" id="cntBreakup"></span></button>
  <button data-t="items">Items<span class="cnt" id="cntItems"></span></button>
</nav>

<section class="controls no-print" id="controls">
  <div class="field">
    <label>Period</label>
    <div class="seg" id="segPeriod">
      <button data-p="month">Month</button>
      <button data-p="year">Full year</button>
      <button data-p="range">Date range</button>
      <button data-p="all">All data</button>
    </div>
  </div>
  <div class="field" id="fMonth">
    <label>Month</label>
    <div class="monthnav">
      <button class="btn" id="prevMonth" title="Previous month">‹</button>
      <select id="selMonth"></select>
      <select id="selYear"></select>
      <button class="btn" id="nextMonth" title="Next month">›</button>
    </div>
  </div>
  <div class="field" id="fYearOnly" style="display:none">
    <label>Year</label>
    <select id="selYear2"></select>
  </div>
  <div class="field" id="fFrom" style="display:none">
    <label>From</label>
    <input type="date" id="dateFrom">
  </div>
  <div class="field" id="fTo" style="display:none">
    <label>To</label>
    <input type="date" id="dateTo">
  </div>
  <div class="field" id="fType">
    <label>Type</label>
    <select id="selType"><option value="">All types</option></select>
  </div>
  <div class="field" id="fCategory" style="display:none">
    <label>Category</label>
    <select id="selCategory"><option value="">All categories</option></select>
  </div>
  <div class="field" id="fSort" style="display:none">
    <label>Sort items by</label>
    <select id="selSort">
      <option value="sell">Revenue</option>
      <option value="qty">Qty sold</option>
      <option value="profit">Profit</option>
      <option value="margin">Margin %</option>
      <option value="code">Item code</option>
    </select>
  </div>
  <div class="field">
    <label>Search</label>
    <input type="search" id="inpSearch" placeholder="Customer, ref # or license…">
  </div>
  <div class="field" id="fView">
    <label>Layout</label>
    <div class="seg" id="segView">
      <button data-v="customer">By customer</button>
      <button data-v="date">By date</button>
    </div>
  </div>
  <div class="field" id="fTotalsOnly" style="display:none">
    <label>Detail</label>
    <label class="checkline"><input type="checkbox" id="chkTotalsOnly"> Totals only</label>
  </div>
</section>

<section class="datastrip no-print" id="datastrip"></section>
<section class="summary no-print" id="summary"></section>

<main class="paper-wrap">
  <div class="sheet" id="sheet"></div>
</main>

<div class="drop-overlay" id="dropOverlay">Drop CSV file(s) to import</div>
<input type="file" id="fileInput" accept=".csv,text/csv" multiple hidden>
<div id="toast"></div>

<script>
/* =====================================================================
   CORE LOGIC — pure functions, no DOM access (testable in Node)
   ===================================================================== */

// RFC-4180-ish CSV parser: quotes, escaped quotes, CR/LF/CRLF, BOM.
function parseCsv(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else if (c === '"') {
      inQ = true;
    } else if (c === ',') {
      row.push(field); field = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      rows.push(row); row = [];
    } else {
      field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// A handful of rows come out of the point-of-sale system HTML-encoded
// ("Tiger Paw Ice &amp; Snow"), so decode text fields as they are read.
const ENTITIES = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ', '#39': "'" };
function decodeEntities(s) {
  if (s.indexOf('&') === -1) return s;
  return s.replace(/&(#x?[0-9a-fA-F]+|[a-zA-Z]+);/g, (m, code) => {
    if (Object.prototype.hasOwnProperty.call(ENTITIES, code)) return ENTITIES[code];
    if (code[0] === '#') {
      const n = code[1] === 'x' || code[1] === 'X'
        ? parseInt(code.slice(2), 16) : parseInt(code.slice(1), 10);
      if (isFinite(n) && n > 0 && n <= 0x10FFFF) return String.fromCodePoint(n);
    }
    return m;
  });
}

function parseDateCell(s) {
  s = String(s || '').trim();
  let m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);       // MM/DD/YYYY
  if (m) return { y: +m[3], mo: +m[1], d: +m[2] };
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{2})$/.exec(s);           // MM/DD/YY
  if (m) { const yy = +m[3]; return { y: yy < 70 ? 2000 + yy : 1900 + yy, mo: +m[1], d: +m[2] }; }
  m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);             // YYYY-MM-DD
  if (m) return { y: +m[1], mo: +m[2], d: +m[3] };
  return null;
}

function dateKeyOf(y, mo, d) { return y * 10000 + mo * 100 + d; }

function parseMoney(s) {
  if (typeof s === 'number') return s;
  s = String(s || '').trim();
  if (!s) return 0;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[$,\s]/g, '');
  if (s.startsWith('-')) { neg = true; s = s.slice(1); }
  const v = parseFloat(s);
  if (!isFinite(v)) return 0;
  return neg ? -v : v;
}

/* ---------- format detection ---------- */
// The three known point-of-sale exports, told apart by their title row
// (or, failing that, by their header row).
function detectFormat(rows) {
  // The raw database tables announce themselves in their header row.
  const head = new Set((rows[0] || []).map(h => String(h).trim().toLowerCase()));
  if (head.has('item_code') && head.has('quantity_on_hand')) return 'products';
  if (head.has('invoice_number') && (head.has('unit_cost') || head.has('bundle_parent_item_code'))) return 'lines';
  if (head.has('invoice_number') && head.has('invoice_type') && head.has('post_date')) return 'invoices';

  const scan = Math.min(rows.length, 12);
  for (let i = 0; i < scan; i++) {
    for (const c of rows[i]) {
      const t = String(c).trim().toLowerCase();
      if (t === 'item sales report') return 'items';
      if (t === 'sales breakup report') return 'breakup';
      if (t === 'sales report') return 'sales';
    }
  }
  for (let i = 0; i < Math.min(rows.length, 80); i++) {
    const cells = rows[i].map(c => String(c).trim().toLowerCase());
    if (cells.includes('qty sold') && cells.includes('invoice ref')) return 'items';
    if (cells.includes('make/model')) return 'breakup';
    if (cells.includes('ref') && cells.includes('customer') && cells.includes('ex hst')) return 'sales';
  }
  return 'sales'; // legacy behavior: try the transactions extractor
}

/* =====================================================================
   Raw database tables (invoice / invoiceItem / product).
   These are proper tables with a real header row, unlike the page-formatted
   report exports, so they are read by column name.
   ===================================================================== */

// Turn a header row + data rows into objects keyed by column name.
function tableRows(rows) {
  if (!rows.length) return [];
  const head = rows[0].map(h => String(h).trim().toLowerCase());
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r.length || r.every(c => !String(c).trim())) continue;
    const o = {};
    for (let j = 0; j < head.length; j++) o[head[j]] = r[j] == null ? '' : String(r[j]).trim();
    out.push(o);
  }
  return out;
}

function num(v) {
  const n = parseFloat(String(v || '').replace(/[$,\s]/g, ''));
  return isFinite(n) ? n : 0;
}

/* --- invoice table ---------------------------------------------------
   Reconciled against the Sales Report export: keeping invoice_status != 'O'
   yields exactly the report's 10,056 invoices, and negating invoice_type 'C'
   rows (credits are stored positive here) matches its money to within
   $221.90 on $4.06M. Field mapping verified row by row:
     Ex HST = subtotal, HST = gst, D/C = discount_on_subtotal,
     Total = total, Cost = cost — all sign-flipped for credits.
   Status 'O' rows are unclosed work and type 'Q' rows are quotes; neither is
   a sale, so both go to a separate pipeline dataset rather than being lost. */
function extractInvoiceTable(rows) {
  const sales = [], pipeline = [];
  // The export repeats three closed invoices byte for byte (55755, 55766 and
  // 56712). They inflate revenue by $1,423.90 and, because there are also
  // exactly three invoices in the report export that are missing here, a
  // row-count check alone looks like a clean reconciliation while two errors
  // quietly cancel. Drop them before anything is counted.
  const seenRow = new Set();
  for (const r of tableRows(rows)) {
    const dt = parseDateCell(r['post_date']);
    if (!dt) continue;
    // Only closed rows carry an invoice number, and only they are duplicated.
    // Quotes and open jobs legitimately share job-card shapes, so leave them
    // alone rather than collapsing distinct estimates.
    if (r['invoice_number']) {
      const fingerprint = [r['invoice_number'], r['post_date'], r['total'], r['subtotal']].join('|');
      if (seenRow.has(fingerprint)) continue;
      seenRow.add(fingerprint);
    }
    const invNo = (r['invoice_number'] || '').trim();
    const jobCard = (r['job_card_number'] || '').trim();
    // Quotes and unclosed jobs have no invoice number yet — they are
    // identified by their job card until they are invoiced.
    const ref = invNo || jobCard;
    if (!ref) continue;
    const type = (r['invoice_type'] || 'I').toUpperCase();
    const status = (r['invoice_status'] || '').toUpperCase();
    const sign = type === 'C' ? -1 : 1;
    const base = {
      ref,
      invoiceNo: invNo,
      y: dt.y, mo: dt.mo, d: dt.d,
      dateKey: dateKeyOf(dt.y, dt.mo, dt.d),
      customer: decodeEntities(r['display_name'] || '') || '(No customer)',
      license: (r['plate_number'] || '').trim(),
      advisor: '',
      make: (r['make'] || '').trim(),
      model: (r['model'] || '').trim(),
      buildDate: (r['build_date'] || '').trim(),
      bodyType: (r['body_type'] || '').trim(),
      odometer: num(r['odometer']),
      jobCard,
      balanceDue: num(r['balance_due']),
      invType: type,
      status,
    };
    if (type === 'Q' || status === 'O') {
      pipeline.push(Object.assign(base, {
        kind: type === 'Q' ? 'quote' : 'open',
        subtotal: num(r['subtotal']),
        total: num(r['total']),
        cost: num(r['cost']),
        id: ref,
      }));
      continue;
    }
    const exHst = sign * num(r['subtotal']);
    const dc = num(r['discount_on_subtotal']);
    const cost = sign * num(r['cost']);
    sales.push(Object.assign(base, {
      type: type === 'C' ? 'Credit' : 'Invoice',
      exHst,
      hst: sign * num(r['gst']),
      dc,
      total: sign * num(r['total']),
      cost,
      profit: Math.round((exHst - dc - cost) * 100) / 100,
    }));
  }
  return { sales, pipeline };
}

/* --- invoiceItem table ---
   Has no date of its own — every row is joined to its invoice by
   invoice_number (see relinkLines). */
function extractInvoiceItemTable(rows) {
  const out = [];
  const occ = new Map();
  for (const r of tableRows(rows)) {
    const invNo = (r['invoice_number'] || '').trim();
    const jobCard = (r['job_card_number'] || '').trim();
    // Lines on work that is not yet invoiced carry only the job card number.
    const ref = invNo || jobCard;
    if (!ref) continue;
    const code = (r['item_code'] || '').trim();
    const amount = num(r['amount']);
    const row = {
      ref, code, jobCard, invoiceNo: invNo,
      desc: decodeEntities(r['description'] || r['product_description'] || ''),
      qty: num(r['quantity']),
      unitPrice: num(r['unit_price']),
      amount,
      subtotal: num(r['subtotal']),
      unitCost: num(r['unit_cost']),
      costIncTax: num(r['cost_including_tax']),
      gst: num(r['gst']),
      hours: num(r['hours_worked']),
      group: (r['product_group_name'] || '').trim(),
      brand: (r['brand'] || '').trim(),
      supplier: (r['product_supplier'] || '').trim(),
      productType: (r['product_type'] || '').trim(),
      // Service-kit header rows: $0 of revenue but they repeat the cost that
      // their child lines already carry. Summing cost without excluding them
      // double-counts $460k. (bundle_parent_item_code is NOT the flag — it is
      // never blank and mostly self-references, so it needs no handling.)
      bom: String(r['is_bom_parent'] || '').trim().toLowerCase() === 'true',
      bundleParent: (r['bundle_parent_item_code'] || '').trim(),
      // dateKey / customer are stamped on by relinkLines once invoices load.
      dateKey: 0, y: 0, mo: 0, d: 0, customer: '', license: '', vehicle: '',
    };
    const base = [ref, code, amount, row.qty].join('|');
    const n = (occ.get(base) || 0) + 1;
    occ.set(base, n);
    row.id = base + '#' + n;
    out.push(row);
  }
  return out;
}

/* --- product table --- */
function extractProductTable(rows) {
  const byCode = new Map();
  for (const r of tableRows(rows)) {
    const code = (r['item_code'] || '').trim();
    if (!code) continue;
    const qoh = num(r['quantity_on_hand']);
    const cost = num(r['cost']);
    const row = {
      code,
      desc: decodeEntities(r['description'] || ''),
      brand: (r['brand'] || '').trim(),
      supplier: (r['supplier'] || '').trim(),
      group: (r['product_group_name'] || '').trim(),
      productType: (r['product_type'] || '').trim(),
      location: (r['location'] || '').trim(),
      qoh,
      reserved: num(r['qty_reserved']),
      retail: num(r['retail_price']),
      cost,
      // Stock value never goes negative: thousands of fee and labour
      // pseudo-items are billed without ever being received, so they sit at
      // large negative counts and would subtract phantom value from any total.
      value: qoh > 0 ? Math.round(qoh * cost * 100) / 100 : 0,
      inactive: String(r['inactive'] || '').toLowerCase() === 'true',
      id: code,
    };
    // 37 item codes are reused for genuinely different products. A code's
    // stock is one number rather than a sum, so keep the row that actually
    // carries the stock.
    const prev = byCode.get(code);
    if (!prev || row.qoh > prev.qoh) byCode.set(code, row);
  }
  return [...byCode.values()];
}

// invoiceItem rows carry no date; stamp each from its invoice so the ordinary
// date filters work on them. Safe to call repeatedly, in any import order.
function relinkLines(lines, salesRows, pipelineRows) {
  const byRef = new Map(), byJob = new Map();
  const index = s => {
    byRef.set(s.ref, s);
    if (s.invoiceNo) byRef.set(s.invoiceNo, s);
    if (s.jobCard && !byJob.has(s.jobCard)) byJob.set(s.jobCard, s);
  };
  for (const s of salesRows || []) index(s);
  for (const s of pipelineRows || []) if (!byRef.has(s.ref)) index(s);
  let linked = 0;
  for (const l of lines) {
    const s = byRef.get(l.ref) || (l.jobCard && byJob.get(l.jobCard));
    if (!s) continue;
    l.dateKey = s.dateKey; l.y = s.y; l.mo = s.mo; l.d = s.d;
    l.customer = s.customer; l.license = s.license;
    l.vehicle = ((s.make || '') + ' ' + (s.model || '')).trim();
    l.invType = s.invType; l.status = s.status;
    // Credit lines are stored positive, like their invoice. Derived from the
    // raw field every time, so re-linking stays idempotent.
    //   rev  — line revenue ex tax. `amount` INCLUDES gst, so `subtotal` is
    //          the field that reconciles to the invoice (10,009 of 10,056).
    //   est  — indicative line cost only: it sums about 2% under the
    //          invoice-level cost, which stays authoritative for margin.
    const sign = s.invType === 'C' ? -1 : 1;
    l.sign = sign;
    l.rev = Math.round(l.subtotal * sign * 100) / 100;
    // The real line cost. unit_cost x quantity reproduces the invoice header
    // cost to within 1% for 2024 onwards — and, crucially, carries no step at
    // Oct 2023, which is when the HEADER field started being recorded
    // properly. So this is the only cost that is comparable across all
    // 45 months. cost_including_tax is not a line cost at all (29% under).
    l.lineCost = l.bom ? 0 : Math.round(l.unitCost * l.qty * sign * 100) / 100;
    l.sold = s.status !== 'O' && s.invType !== 'Q';
    linked++;
  }
  return linked;
}

/* ---------- Sales Report (transactions) ---------- */
const FALLBACK_COLS ={ ref: 0, date: 4, type: 5, customer: 6, advisor: 7, license: 8, exHst: 10, hst: 11, dc: 12, total: 13, cost: 14, profit: 15 };

const HEADER_ALIASES = {
  ref:      ['ref', 'ref #', 'reference', 'invoice #', 'invoice'],
  date:     ['date', 'invoice date'],
  type:     ['type', 'doc type'],
  customer: ['customer', 'customer name', 'client'],
  advisor:  ['service advisor', 'advisor'],
  license:  ['license', 'licence', 'license plate', 'plate'],
  exHst:    ['ex hst', 'ex. hst', 'ex-hst', 'subtotal', 'amount ex hst'],
  hst:      ['hst', 'tax', 'gst/hst'],
  dc:       ['d/c', 'dc', 'discount'],
  total:    ['total', 'total inc hst'],
  cost:     ['cost ex. hst', 'cost ex hst', 'cost', 'cost ex. tax'],
  profit:   ['profit', 'gross profit'],
};

function findColumns(rows) {
  const scan = Math.min(rows.length, 80);
  for (let i = 0; i < scan; i++) {
    const cells = rows[i].map(c => String(c).trim().toLowerCase());
    if (cells.includes('ref') && cells.includes('date') && cells.includes('customer')) {
      const map = {};
      for (const key of Object.keys(HEADER_ALIASES)) {
        for (let j = 0; j < cells.length; j++) {
          if (HEADER_ALIASES[key].includes(cells[j])) { map[key] = j; break; }
        }
      }
      if (map.ref != null && map.date != null && map.customer != null) return map;
    }
  }
  return null;
}

// Pull real invoice/credit rows out of a raw report export, ignoring the
// title block, repeated page headers, per-customer subtotal rows, grand
// total row and "Page x of y" footers.
function extractInvoices(rows) {
  const cols = findColumns(rows) || FALLBACK_COLS;
  const out = [];
  for (const r of rows) {
    const ref = String(r[cols.ref] || '').trim();
    if (!/^\d+$/.test(ref)) continue;
    const dt = parseDateCell(r[cols.date]);
    if (!dt) continue;
    const get = k => (cols[k] == null ? '' : decodeEntities(String(r[cols[k]] || '').trim()));
    out.push({
      ref,
      y: dt.y, mo: dt.mo, d: dt.d,
      dateKey: dateKeyOf(dt.y, dt.mo, dt.d),
      type: get('type') || 'Invoice',
      customer: get('customer') || '(No customer)',
      advisor: get('advisor'),
      license: get('license'),
      exHst: parseMoney(get('exHst')),
      hst: parseMoney(get('hst')),
      dc: parseMoney(get('dc')),
      total: parseMoney(get('total')),
      cost: parseMoney(get('cost')),
      profit: parseMoney(get('profit')),
    });
  }
  return out;
}

/* ---------- Sales Breakup Report (line items by category) ---------- */
// Fixed layout (the export's header row is misaligned with its data by one
// column around "Cost Ex.", so header-mapping cannot be trusted here):
// 0=Ref 4=Date 5=Item Code 6=Description 7=Type 8=Customer 10=License
// 11=Make/Model 12=Amount 14=Cost Ex. 15=HST 16=Profit.
// Rows belong to the category named by the group-header line above them
// (SUBLET REPAIR / LABOUR / STOCK / TIRES / CONSUMABLES).
function extractBreakup(rows) {
  const out = [];
  const occ = new Map();
  let category = 'UNCATEGORIZED';
  for (const r of rows) {
    const c0 = String(r[0] || '').trim();
    const dt = r.length >= 17 ? parseDateCell(r[4]) : null;
    if (/^\d+$/.test(c0) && dt) {
      const t = i => decodeEntities(String(r[i] || '').trim());
      const row = {
        ref: c0,
        y: dt.y, mo: dt.mo, d: dt.d,
        dateKey: dateKeyOf(dt.y, dt.mo, dt.d),
        category,
        code: t(5),
        desc: t(6),
        type: t(7) || 'Invoice',
        customer: t(8),
        license: t(10),
        vehicle: t(11),
        amount: parseMoney(t(12)),
        cost: parseMoney(t(14)),
        hst: parseMoney(t(15)),
        profit: parseMoney(t(16)),
      };
      // Stable id: natural key + occurrence index, so re-importing the same
      // or an overlapping export never duplicates rows, while genuinely
      // repeated line items within one invoice are preserved.
      const base = [row.ref, row.dateKey, row.code, row.desc, row.amount].join('|');
      const n = (occ.get(base) || 0) + 1;
      occ.set(base, n);
      row.id = base + '#' + n;
      out.push(row);
    } else if (c0 && !/^\d+$/.test(c0) && !(r[4] && String(r[4]).trim()) &&
               c0 !== 'Ref' && !c0.startsWith('Page') && !c0.startsWith('Grand') &&
               !c0.startsWith('Date') && !c0.includes('Total:')) {
      category = c0;
    }
  }
  return out;
}

/* ---------- Item Sales Report (per-product sales) ---------- */
// Layout: 0=Date(MM/DD/YY) 2=Invoice Ref 4=Item Code 5=Service Advisor
// 6=Description 7=Supplier 8=QOH 9=Qty Sold 10=Sell Price 12=Unit Cost 14=Cost.
// Sell Price and Cost are line totals; Unit Cost is per unit.
function extractItems(rows) {
  const out = [];
  const occ = new Map();
  for (const r of rows) {
    if (r.length < 15) continue;
    const dt = parseDateCell(r[0]);
    const ref = String(r[2] || '').trim();
    if (!dt || !/^\d+$/.test(ref)) continue;
    const t = i => decodeEntities(String(r[i] || '').trim());
    const row = {
      ref,
      y: dt.y, mo: dt.mo, d: dt.d,
      dateKey: dateKeyOf(dt.y, dt.mo, dt.d),
      code: t(4),
      advisor: t(5),
      desc: t(6),
      supplier: t(7),
      qty: parseMoney(t(9)),
      sell: parseMoney(t(10)),
      unitCost: parseMoney(t(12)),
      cost: parseMoney(t(14)),
    };
    const base = [row.ref, row.dateKey, row.code, row.sell].join('|');
    const n = (occ.get(base) || 0) + 1;
    occ.set(base, n);
    row.id = base + '#' + n;
    out.push(row);
  }
  return out;
}

/* ---------- report building ---------- */
function sumRows(rows) {
  const t = { exHst: 0, hst: 0, dc: 0, total: 0, cost: 0, profit: 0 };
  for (const r of rows) {
    t.exHst += r.exHst; t.hst += r.hst; t.dc += r.dc;
    t.total += r.total; t.cost += r.cost; t.profit += r.profit;
  }
  return t;
}

// GP% as the source system computes it: profit ÷ (Ex HST − D/C).
function gpPercent(exHst, dc, profit) {
  const den = exHst - dc;
  if (Math.abs(den) < 1e-9) return 0;
  return (profit / den) * 100;
}

function byCustomerName(a, b) {
  const la = a.toLowerCase(), lb = b.toLowerCase();
  return la < lb ? -1 : la > lb ? 1 : 0;
}

function byDateThenRef(a, b) {
  return (a.dateKey - b.dateKey) || (parseInt(a.ref, 10) - parseInt(b.ref, 10));
}

function inRange(r, f) {
  if (f.fromKey != null && r.dateKey < f.fromKey) return false;
  if (f.toKey != null && r.dateKey > f.toKey) return false;
  return true;
}

// filters: { fromKey, toKey, search, type, groupBy: 'customer'|'date' }
function buildReport(invoices, filters) {
  const f = filters || {};
  const q = (f.search || '').trim().toLowerCase();
  const rows = invoices.filter(r => {
    if (!inRange(r, f)) return false;
    if (f.type && r.type !== f.type) return false;
    if (q && !(r.customer.toLowerCase().includes(q) ||
               r.ref.includes(q) ||
               r.license.toLowerCase().includes(q))) return false;
    return true;
  });

  const totals = sumRows(rows);
  const customers = new Set(rows.map(r => r.customer.toLowerCase()));
  const report = {
    rows,
    totals,
    gp: gpPercent(totals.exHst, totals.dc, totals.profit),
    invoiceCount: rows.filter(r => r.type === 'Invoice').length,
    creditCount: rows.filter(r => r.type === 'Credit').length,
    customerCount: customers.size,
    groups: null,
  };

  if ((f.groupBy || 'customer') === 'customer') {
    const map = new Map();
    for (const r of rows) {
      const key = r.customer.toLowerCase();
      if (!map.has(key)) map.set(key, { name: r.customer, rows: [] });
      map.get(key).rows.push(r);
    }
    const groups = [...map.values()].sort((a, b) => byCustomerName(a.name, b.name));
    for (const g of groups) {
      g.rows.sort(byDateThenRef);
      g.totals = sumRows(g.rows);
      g.gp = gpPercent(g.totals.exHst, g.totals.dc, g.totals.profit);
    }
    report.groups = groups;
  } else {
    report.rows = rows.slice().sort(byDateThenRef);
  }
  return report;
}

function sumBreakup(rows) {
  const t = { n: rows.length, amount: 0, cost: 0, hst: 0, profit: 0 };
  for (const r of rows) { t.amount += r.amount; t.cost += r.cost; t.hst += r.hst; t.profit += r.profit; }
  return t;
}

// filters: { fromKey, toKey, search, type, category }
function buildBreakupReport(lines, filters) {
  const f = filters || {};
  const q = (f.search || '').trim().toLowerCase();
  const rows = lines.filter(r => {
    if (!inRange(r, f)) return false;
    if (f.type && r.type !== f.type) return false;
    if (f.category && r.category !== f.category) return false;
    if (q && !(r.customer.toLowerCase().includes(q) ||
               r.ref.includes(q) ||
               r.license.toLowerCase().includes(q) ||
               r.code.toLowerCase().includes(q) ||
               r.desc.toLowerCase().includes(q) ||
               r.vehicle.toLowerCase().includes(q))) return false;
    return true;
  });
  const map = new Map();
  for (const r of rows) {
    if (!map.has(r.category)) map.set(r.category, { name: r.category, rows: [] });
    map.get(r.category).rows.push(r);
  }
  const cats = [...map.values()];
  for (const c of cats) {
    c.rows.sort(byDateThenRef);
    c.totals = sumBreakup(c.rows);
    c.gp = c.totals.amount ? (c.totals.profit / c.totals.amount) * 100 : 0;
  }
  cats.sort((a, b) => b.totals.amount - a.totals.amount);
  const totals = sumBreakup(rows);
  return {
    rows, cats, totals,
    gp: totals.amount ? (totals.profit / totals.amount) * 100 : 0,
    refCount: new Set(rows.map(r => r.ref)).size,
  };
}

// filters: { fromKey, toKey, search, sort: 'sell'|'qty'|'profit'|'margin'|'code' }
function buildItemsReport(lines, filters) {
  const f = filters || {};
  const q = (f.search || '').trim().toLowerCase();
  const rows = lines.filter(r => {
    if (!inRange(r, f)) return false;
    if (q && !(r.code.toLowerCase().includes(q) ||
               r.desc.toLowerCase().includes(q) ||
               r.supplier.toLowerCase().includes(q) ||
               r.ref.includes(q))) return false;
    return true;
  });
  const map = new Map();
  for (const r of rows) {
    let it = map.get(r.code);
    if (!it) { it = { code: r.code, desc: r.desc, supplier: r.supplier, n: 0, qty: 0, sell: 0, cost: 0 }; map.set(r.code, it); }
    it.n++; it.qty += r.qty; it.sell += r.sell; it.cost += r.cost;
    if (!it.desc && r.desc) it.desc = r.desc;
    if (!it.supplier && r.supplier) it.supplier = r.supplier;
  }
  const items = [...map.values()];
  for (const it of items) {
    it.profit = it.sell - it.cost;
    it.margin = it.sell ? (it.profit / it.sell) * 100 : 0;
  }
  const sort = f.sort || 'sell';
  items.sort((a, b) =>
    sort === 'qty' ? b.qty - a.qty :
    sort === 'profit' ? b.profit - a.profit :
    sort === 'margin' ? b.margin - a.margin :
    sort === 'code' ? (a.code.toLowerCase() < b.code.toLowerCase() ? -1 : 1) :
    b.sell - a.sell);
  const totals = { n: rows.length, qty: 0, sell: 0, cost: 0 };
  for (const r of rows) { totals.qty += r.qty; totals.sell += r.sell; totals.cost += r.cost; }
  totals.profit = totals.sell - totals.cost;
  return {
    rows, items, totals,
    margin: totals.sell ? (totals.profit / totals.sell) * 100 : 0,
    itemCount: items.length,
  };
}

/* ---------- formatting ---------- */
// Formats amounts the way the source report does: $-58.71, no thousands separators.
function fmtMoney(v) {
  let r = Math.round(v * 100) / 100;
  if (Math.abs(r) < 0.005) r = 0;
  const sign = r < 0 ? '-' : '';
  return '$' + sign + Math.abs(r).toFixed(2);
}

function fmtGp(v) { return (Math.abs(v) < 0.005 ? 0 : v).toFixed(2); }

function fmtQty(v) {
  const r = Math.round(v * 100) / 100;
  return String(parseFloat(r.toFixed(2)));
}

function fmtDateMdy(y, mo, d) {
  const p = n => String(n).padStart(2, '0');
  return p(mo) + '/' + p(d) + '/' + y;
}

function daysInMonth(y, mo) { return new Date(y, mo, 0).getDate(); }

/* =====================================================================
   DASHBOARD ANALYTICS — aggregation over the parsed rows.
   Every figure the dashboard shows comes from one of these.
   ===================================================================== */
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function monthKeyOf(y, mo) { return y * 100 + mo; }
function mkYear(mk) { return Math.floor(mk / 100); }
function mkMonth(mk) { return mk % 100; }
function mkOfDateKey(dk) { return Math.floor(dk / 100); }
function keyToDate(k) { return { y: Math.floor(k / 10000), mo: Math.floor(k / 100) % 100, d: k % 100 }; }

function addMonths(mk, delta) {
  const t = mkYear(mk) * 12 + (mkMonth(mk) - 1) + delta;
  return monthKeyOf(Math.floor(t / 12), (t % 12 + 12) % 12 + 1);
}

function shiftDateYears(p, delta) {
  const y = p.y + delta;
  return { y, mo: p.mo, d: Math.min(p.d, daysInMonth(y, p.mo)) };
}

function shiftDateMonths(p, delta) {
  const t = p.y * 12 + (p.mo - 1) + delta;
  const y = Math.floor(t / 12), mo = (t % 12 + 12) % 12 + 1;
  return { y, mo, d: Math.min(p.d, daysInMonth(y, mo)) };
}

function dayNum(y, mo, d) { return Math.round(Date.UTC(y, mo - 1, d) / 86400000); }
function fromDayNum(n) {
  const dt = new Date(n * 86400000);
  return { y: dt.getUTCFullYear(), mo: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
}
function dateKeyOfPoint(p) { return dateKeyOf(p.y, p.mo, p.d); }

// The earliest and latest transaction actually on file.
function coverageOf(rows) {
  let min = null, max = null;
  for (const r of rows) {
    if (min === null || r.dateKey < min) min = r.dateKey;
    if (max === null || r.dateKey > max) max = r.dateKey;
  }
  return min === null ? null : { minKey: min, maxKey: max };
}

// Months at the edges of the data that are not fully covered. Comparing these
// to whole months is the single easiest way to read a false trend, so every
// chart and comparison marks them.
function partialMonthSet(coverage) {
  const s = new Set();
  if (!coverage) return s;
  const minD = keyToDate(coverage.minKey), maxD = keyToDate(coverage.maxKey);
  if (minD.d > 1) s.add(monthKeyOf(minD.y, minD.mo));
  if (maxD.d < daysInMonth(maxD.y, maxD.mo)) s.add(monthKeyOf(maxD.y, maxD.mo));
  return s;
}

function partialYearSet(coverage) {
  const s = new Set();
  if (!coverage) return s;
  const minD = keyToDate(coverage.minKey), maxD = keyToDate(coverage.maxKey);
  if (minD.mo > 1 || minD.d > 1) s.add(minD.y);
  if (maxD.mo < 12 || maxD.d < 31) s.add(maxD.y);
  return s;
}

function emptyAgg() {
  return { n: 0, exHst: 0, hst: 0, dc: 0, total: 0, cost: 0, profit: 0, customers: 0, gp: 0, avgInvoice: 0 };
}

function finishAgg(t, custs) {
  t.customers = custs ? custs.size : 0;
  t.gp = gpPercent(t.exHst, t.dc, t.profit);
  t.avgInvoice = t.n ? t.exHst / t.n : 0;
  return t;
}

function aggregateRange(rows, fromKey, toKey) {
  const t = emptyAgg(), custs = new Set();
  for (const r of rows) {
    if (fromKey != null && r.dateKey < fromKey) continue;
    if (toKey != null && r.dateKey > toKey) continue;
    t.n++; t.exHst += r.exHst; t.hst += r.hst; t.dc += r.dc;
    t.total += r.total; t.cost += r.cost; t.profit += r.profit;
    custs.add(r.customer.toLowerCase());
  }
  return finishAgg(t, custs);
}

// One dense bucket per calendar month across the whole span, so the trend chart
// shows a gap month as a gap rather than silently closing it up.
function monthlySeries(rows, coverage) {
  const cov = coverage || coverageOf(rows);
  if (!cov) return [];
  const map = new Map();
  for (const r of rows) {
    const mk = mkOfDateKey(r.dateKey);
    let b = map.get(mk);
    if (!b) { b = { t: emptyAgg(), custs: new Set() }; map.set(mk, b); }
    const t = b.t;
    t.n++; t.exHst += r.exHst; t.hst += r.hst; t.dc += r.dc;
    t.total += r.total; t.cost += r.cost; t.profit += r.profit;
    b.custs.add(r.customer.toLowerCase());
  }
  const out = [];
  const endMk = mkOfDateKey(cov.maxKey);
  for (let mk = mkOfDateKey(cov.minKey); mk <= endMk; mk = addMonths(mk, 1)) {
    const b = map.get(mk);
    const t = b ? finishAgg(b.t, b.custs) : emptyAgg();
    out.push(Object.assign({ mk, y: mkYear(mk), mo: mkMonth(mk) }, t));
  }
  return out;
}

function movingAverage(series, field, window) {
  return series.map((_, i) => {
    const from = Math.max(0, i - window + 1);
    let sum = 0;
    for (let j = from; j <= i; j++) sum += series[j][field];
    return sum / (i - from + 1);
  });
}

function pctChange(cur, prev) {
  if (prev == null || Math.abs(prev) < 1e-9) return null;
  return (cur - prev) / Math.abs(prev) * 100;
}

// The comparison engine. The selected range is CLAMPED to the data actually on
// file, and the comparison windows are the same shape shifted back — so a
// three-day-old month is compared against the same three days a year ago,
// never against a whole month.
function periodComparison(rows, range, period, coverage) {
  const cov = coverage || coverageOf(rows);
  if (!cov) return null;
  const fromKey = dateKeyOfPoint(range.from);
  const rawToKey = dateKeyOfPoint(range.to);
  const toKey = Math.min(rawToKey, cov.maxKey);
  if (toKey < fromKey) {
    return { current: emptyAgg(), prev: null, lastYear: null, truncated: false, empty: true,
             from: range.from, to: range.to, prevLabel: '', lastYearLabel: '' };
  }
  const to = keyToDate(toKey);
  const truncated = rawToKey > cov.maxKey && dateKeyOfPoint(range.from) <= cov.maxKey && period !== 'all';

  const spanDays = dayNum(to.y, to.mo, to.d) - dayNum(range.from.y, range.from.mo, range.from.d);
  let prevFrom, prevTo, prevLabel;
  if (period === 'month') {
    prevFrom = shiftDateMonths(range.from, -1);
    prevTo = shiftDateMonths(to, -1);
    prevLabel = MONTH_ABBR[prevFrom.mo - 1] + ' ' + prevFrom.y;
  } else if (period === 'year') {
    prevFrom = shiftDateYears(range.from, -1);
    prevTo = shiftDateYears(to, -1);
    prevLabel = String(prevFrom.y);
  } else {
    const endDay = dayNum(range.from.y, range.from.mo, range.from.d) - 1;
    prevTo = fromDayNum(endDay);
    prevFrom = fromDayNum(endDay - spanDays);
    prevLabel = 'previous ' + (spanDays + 1) + ' days';
  }
  const lyFrom = shiftDateYears(range.from, -1), lyTo = shiftDateYears(to, -1);

  const inCov = (a, b) => dateKeyOfPoint(b) >= cov.minKey && dateKeyOfPoint(a) <= cov.maxKey;
  return {
    from: range.from, to, truncated, empty: false,
    current: aggregateRange(rows, fromKey, toKey),
    prev: inCov(prevFrom, prevTo) ? aggregateRange(rows, dateKeyOfPoint(prevFrom), dateKeyOfPoint(prevTo)) : null,
    lastYear: inCov(lyFrom, lyTo) ? aggregateRange(rows, dateKeyOfPoint(lyFrom), dateKeyOfPoint(lyTo)) : null,
    prevLabel,
    lastYearLabel: period === 'month' ? MONTH_ABBR[lyFrom.mo - 1] + ' ' + lyFrom.y : String(lyFrom.y),
  };
}

// Calendar-month grid, one row per year — the shape behind the year-over-year
// chart. Months with no data at all stay null so a line does not dive to zero.
function yearMonthGrid(series, field) {
  const years = [...new Set(series.map(s => s.y))].sort((a, b) => a - b);
  const byYear = new Map(years.map(y => [y, Array(12).fill(null)]));
  for (const s of series) {
    if (s.n === 0) continue;
    byYear.get(s.y)[s.mo - 1] = field ? s[field] : s;
  }
  return { years, byYear };
}

// Seasonal shape, normalized so growth between years does not masquerade as
// seasonality: each month is indexed against its own year's average month,
// then averaged across years. 100 = an average month. Partial months excluded.
function seasonalityIndex(series, partialSet, field) {
  const f = field || 'exHst';
  const byYear = new Map();
  for (const s of series) {
    if (s.n === 0 || (partialSet && partialSet.has(s.mk))) continue;
    if (!byYear.has(s.y)) byYear.set(s.y, []);
    byYear.get(s.y).push(s);
  }
  const acc = Array.from({ length: 12 }, () => []);
  for (const arr of byYear.values()) {
    if (arr.length < 2) continue;
    const avg = arr.reduce((a, b) => a + b[f], 0) / arr.length;
    if (Math.abs(avg) < 1e-9) continue;
    for (const s of arr) acc[s.mo - 1].push(s[f] / avg * 100);
  }
  return acc.map((vals, i) => ({
    mo: i + 1,
    index: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null,
    years: vals.length,
  }));
}

/* True margin, computed from line-level cost.

   The invoice HEADER cost field was not recorded properly before Oct 2023 —
   it sits at ~33% of revenue until Sep 2023 then steps to ~55%, which reads as
   a margin collapse that never happened. The LINE cost (unit_cost x quantity,
   excluding the $0-revenue service-kit header rows) has no such step: 56.2% in
   Apr 2023, 55.6% in Sep 2023, 58.3% in Oct 2023. From 2024 on the two agree
   within 1%, so the line figure is both correct and continuous, and it is the
   only cost comparable across all 45 months.

   The caveat that stops this being read as good news: the shop's internal
   labour charge rate was cut from a median $64/hr in 2024 to $49 in 2025 while
   the labour price rose $128 to $139, so most of the apparent margin gain is
   that change, not trading. Excluding labour the margin is far flatter. */
function lineMarginAnalysis(lines, coverage) {
  const sold = lines.filter(l => l.sold && !l.bom && l.dateKey);
  if (sold.length < 100) return null;
  const cov = coverage || null;
  const month = new Map();
  const year = new Map();
  const types = new Map();
  let rev = 0, cost = 0, exLabRev = 0, exLabCost = 0;
  for (const l of sold) {
    rev += l.rev; cost += l.lineCost;
    const mk = mkOfDateKey(l.dateKey);
    const m = month.get(mk) || { mk, rev: 0, cost: 0 };
    m.rev += l.rev; m.cost += l.lineCost; month.set(mk, m);
    const y = year.get(l.y) || { y: l.y, rev: 0, cost: 0, exRev: 0, exCost: 0 };
    y.rev += l.rev; y.cost += l.lineCost;
    if (l.productType !== 'J') { y.exRev += l.rev; y.exCost += l.lineCost; exLabRev += l.rev; exLabCost += l.lineCost; }
    year.set(l.y, y);
    const t = types.get(l.productType || '?') || { type: l.productType || '?', rev: 0, cost: 0, n: 0 };
    t.rev += l.rev; t.cost += l.lineCost; t.n++; types.set(l.productType || '?', t);
  }
  const gm = (r, c) => r ? (r - c) / r * 100 : 0;
  const months = [...month.values()].sort((a, b) => a.mk - b.mk)
    .map(m => Object.assign(m, { gm: gm(m.rev, m.cost) }));
  const TYPE_LABEL = { S: 'Parts', J: 'Labour', T: 'Tires', W: 'Wheel & tire service' };
  return {
    rev, cost, gm: gm(rev, cost),
    exLabourGm: gm(exLabRev, exLabCost),
    months,
    years: [...year.values()].sort((a, b) => a.y - b.y)
      .map(y => Object.assign(y, { gm: gm(y.rev, y.cost), exGm: gm(y.exRev, y.exCost) })),
    types: [...types.values()]
      .filter(t => t.rev > rev * 0.005)
      .map(t => Object.assign(t, { label: TYPE_LABEL[t.type] || t.type, gm: gm(t.rev, t.cost) }))
      .sort((a, b) => b.rev - a.rev),
  };
}

// Median internal charge rate for labour, per year — the thing that makes the
// margin trend look better than the trading actually was.
function labourRateByYear(lines) {
  const byYear = new Map();
  for (const l of lines) {
    if (!l.sold || l.bom || l.code !== 'LABOUR' || !l.y) continue;
    if (!byYear.has(l.y)) byYear.set(l.y, { y: l.y, cost: [], price: [] });
    const e = byYear.get(l.y);
    if (l.unitCost > 0) e.cost.push(l.unitCost);
    if (l.unitPrice > 0) e.price.push(l.unitPrice);
  }
  const med = a => { const b = a.slice().sort((x, y) => x - y); return b.length ? b[Math.floor(b.length / 2)] : null; };
  return [...byYear.values()].sort((a, b) => a.y - b.y)
    .map(e => ({ y: e.y, n: e.cost.length, cost: med(e.cost), price: med(e.price) }));
}

// Kept only so an app fed nothing but the report exports still warns about the
// header-cost step. With line data loaded, lineMarginAnalysis supersedes it.
function marginBreakDetect(series) {
  const pts = series.filter(s => s.exHst > 1000 && s.n >= 20);
  if (pts.length < 8) return null;
  const ratio = s => s.cost / s.exHst;
  let best = null;
  for (let i = 3; i <= pts.length - 3; i++) {
    const before = pts.slice(0, i), after = pts.slice(i);
    const mb = before.reduce((a, s) => a + ratio(s), 0) / before.length;
    const ma = after.reduce((a, s) => a + ratio(s), 0) / after.length;
    const jump = ma - mb;
    if (jump > 0.15 && (!best || jump > best.jump)) {
      best = { jump, mk: pts[i].mk, beforeRatio: mb, afterRatio: ma, beforeCount: before.length };
    }
  }
  if (!best) return null;
  // Only report a genuine step: the earlier stretch must be consistently lower.
  const beforeMax = Math.max(...pts.slice(0, best.beforeCount).map(ratio));
  const afterMin = Math.min(...pts.slice(best.beforeCount).map(ratio));
  return beforeMax < afterMin + 0.08 ? best : null;
}

function categoryTotalsInRange(breakupRows, fromKey, toKey) {
  const map = new Map();
  for (const r of breakupRows) {
    if (fromKey != null && r.dateKey < fromKey) continue;
    if (toKey != null && r.dateKey > toKey) continue;
    let c = map.get(r.category);
    if (!c) { c = { name: r.category, n: 0, amount: 0, cost: 0, hst: 0, profit: 0 }; map.set(r.category, c); }
    c.n++; c.amount += r.amount; c.cost += r.cost; c.hst += r.hst; c.profit += r.profit;
  }
  const cats = [...map.values()];
  for (const c of cats) c.gp = c.amount ? c.profit / c.amount * 100 : 0;
  cats.sort((a, b) => b.amount - a.amount);
  const total = cats.reduce((a, c) => a + c.amount, 0);
  for (const c of cats) c.share = total ? c.amount / total * 100 : 0;
  return { cats, total, profit: cats.reduce((a, c) => a + c.profit, 0) };
}

// Category mix per year — the shape behind the stacked mix chart.
function categoryMixByYear(breakupRows) {
  const byYear = new Map();
  for (const r of breakupRows) {
    const y = Math.floor(r.dateKey / 10000);
    if (!byYear.has(y)) byYear.set(y, new Map());
    const m = byYear.get(y);
    let c = m.get(r.category);
    if (!c) { c = { name: r.category, amount: 0, profit: 0, n: 0 }; m.set(r.category, c); }
    c.amount += r.amount; c.profit += r.profit; c.n++;
  }
  const years = [...byYear.keys()].sort((a, b) => a - b);
  const names = [...new Set(breakupRows.map(r => r.category))];
  return years.map(y => {
    const m = byYear.get(y);
    const total = [...m.values()].reduce((a, c) => a + c.amount, 0);
    return {
      y, total,
      cats: names.map(name => {
        const c = m.get(name) || { name, amount: 0, profit: 0, n: 0 };
        return { name, amount: c.amount, profit: c.profit, n: c.n, share: total ? c.amount / total * 100 : 0 };
      }),
    };
  });
}

function topCustomersInRange(rows, fromKey, toKey, limit) {
  const map = new Map();
  for (const r of rows) {
    if (fromKey != null && r.dateKey < fromKey) continue;
    if (toKey != null && r.dateKey > toKey) continue;
    const k = r.customer.toLowerCase();
    let c = map.get(k);
    if (!c) { c = { name: r.customer, n: 0, exHst: 0, dc: 0, profit: 0 }; map.set(k, c); }
    c.n++; c.exHst += r.exHst; c.dc += r.dc; c.profit += r.profit;
  }
  const out = [...map.values()];
  for (const c of out) c.gp = gpPercent(c.exHst, c.dc, c.profit);
  out.sort((a, b) => b.exHst - a.exHst);
  return { rows: out.slice(0, limit || 10), customerCount: out.length };
}

function topItemsInRange(itemRows, fromKey, toKey, limit) {
  const map = new Map();
  for (const r of itemRows) {
    if (fromKey != null && r.dateKey < fromKey) continue;
    if (toKey != null && r.dateKey > toKey) continue;
    let it = map.get(r.code);
    if (!it) { it = { code: r.code, desc: r.desc, n: 0, qty: 0, sell: 0, cost: 0 }; map.set(r.code, it); }
    it.n++; it.qty += r.qty; it.sell += r.sell; it.cost += r.cost;
    if (!it.desc && r.desc) it.desc = r.desc;
  }
  const out = [...map.values()];
  for (const it of out) {
    it.profit = it.sell - it.cost;
    it.margin = it.sell ? it.profit / it.sell * 100 : 0;
  }
  out.sort((a, b) => b.sell - a.sell);
  return { rows: out.slice(0, limit || 10), itemCount: out.length };
}

// Vehicle mix, from the Make/Model and licence-plate columns of the breakup
// export. Plates identify vehicles; the make is the first word of Make/Model.
function vehicleStats(breakupRows, fromKey, toKey, limit) {
  const makes = new Map(), plates = new Map();
  for (const r of breakupRows) {
    if (fromKey != null && r.dateKey < fromKey) continue;
    if (toKey != null && r.dateKey > toKey) continue;
    const plate = r.license.trim().toUpperCase();
    const make = (r.vehicle || '').trim().split(/\s+/)[0].toUpperCase();
    if (make) {
      let m = makes.get(make);
      if (!m) { m = { make, amount: 0, profit: 0, lines: 0, plates: new Set(), refs: new Set() }; makes.set(make, m); }
      m.amount += r.amount; m.profit += r.profit; m.lines++;
      if (plate) m.plates.add(plate);
      m.refs.add(r.ref);
    }
    if (plate) {
      let p = plates.get(plate);
      if (!p) { p = { plate, refs: new Set(), amount: 0 }; plates.set(plate, p); }
      p.refs.add(r.ref); p.amount += r.amount;
    }
  }
  const list = [...makes.values()].map(m => ({
    make: m.make, amount: m.amount, profit: m.profit, lines: m.lines,
    vehicles: m.plates.size, visits: m.refs.size,
  })).sort((a, b) => b.amount - a.amount);
  const visitCounts = [...plates.values()].map(p => p.refs.size);
  const repeat = visitCounts.filter(v => v > 1).length;
  return {
    makes: list.slice(0, limit || 10),
    makeCount: list.length,
    totalAmount: list.reduce((a, m) => a + m.amount, 0),
    vehicles: plates.size,
    repeatVehicles: repeat,
    avgVisits: plates.size ? visitCounts.reduce((a, b) => a + b, 0) / plates.size : 0,
  };
}

// Add-on services worth attaching to a tyre sale. Matched on item code first,
// then description, so a renamed part still lands in the right bucket.
const ATTACH_TRIGGER = ['TIRE_NOR', 'TIRE_OR', 'TIRE_NOR19', 'TIRE_WIN'];
const ATTACH_SERVICES = [
  { key: 'Alignment', match: ['ALIGN', 'WACAR', 'WATRUCK'] },
  { key: 'TPMS / valves', match: ['TPMS', 'TIREVALVE', 'SENSOR', 'VALVE'] },
  { key: 'Nitrogen fill', match: ['NITRO'] },
  { key: 'Tire storage', match: ['TIRESTORAGE', 'STORAGE'] },
  { key: 'Road hazard / warranty', match: ['HAZARD', 'WARRANTY', 'ROADHAZ'] },
];

// What share of tyre sales also picked up each add-on. Computed per invoice,
// so an invoice counts once however many lines it has.
function attachRates(breakupRows, fromKey, toKey) {
  const inv = new Map();
  for (const r of breakupRows) {
    if (fromKey != null && r.dateKey < fromKey) continue;
    if (toKey != null && r.dateKey > toKey) continue;
    let e = inv.get(r.ref);
    if (!e) { e = { tokens: [], amount: 0 }; inv.set(r.ref, e); }
    e.tokens.push((r.code + ' ' + r.desc).toUpperCase());
    e.amount += r.amount;
  }
  const hits = (e, list) => e.tokens.some(t => list.some(m => t.includes(m)));
  const tyre = [...inv.values()].filter(e => hits(e, ATTACH_TRIGGER));
  const services = ATTACH_SERVICES.map(s => {
    const withIt = tyre.filter(e => hits(e, s.match));
    const without = tyre.filter(e => !hits(e, s.match));
    const avg = arr => arr.length ? arr.reduce((a, e) => a + e.amount, 0) / arr.length : 0;
    return {
      key: s.key, n: withIt.length,
      rate: tyre.length ? withIt.length / tyre.length * 100 : 0,
      avgWith: avg(withIt), avgWithout: avg(without),
    };
  }).filter(s => s.n > 0 || s.key === 'Alignment');
  return { tyreInvoices: tyre.length, totalInvoices: inv.size, services };
}

/* Work that was recommended and never done.
   A quote in this system is never "pending": when a customer accepts, the job
   card is upgraded in place and stops being a quote row. Every surviving quote
   has a blank invoice number and status 'O'. So these rows are, by
   construction, the work that was declined — which is why this measures
   DOLLARS DECLINED and not a conversion rate. A conversion rate is not
   computable here (no quote job card appears among the invoice job cards) and
   inventing one would be worse than useless. */
function declinedWork(pipelineRows, salesRows, lineRows, fromKey, toKey, asOfKey) {
  const inWin = r => (fromKey == null || r.dateKey >= fromKey) && (toKey == null || r.dateKey <= toKey);
  const quotes = pipelineRows.filter(r => r.kind === 'quote' && inWin(r));
  const sold = salesRows.filter(inWin);
  if (!quotes.length && !sold.length) return null;
  const quoted = quotes.reduce((a, r) => a + r.subtotal, 0);
  const soldValue = sold.reduce((a, r) => a + r.exHst, 0);

  // Split by the product_type field, which is fully populated and needs no
  // keyword guessing: S = parts, J = labour, T = tyres, W = wheel/tyre service.
  const qRefs = new Set(quotes.map(r => r.ref));
  const soldRefs = new Set(sold.map(r => r.ref));
  const TYPE_LABEL = { S: 'Parts', J: 'Labour', T: 'Tires', W: 'Wheel & tire service' };
  const byType = new Map();
  for (const l of lineRows) {
    if (!l.productType) continue;
    const isQuote = qRefs.has(l.ref), isSold = l.sold && soldRefs.has(l.ref);
    if (!isQuote && !isSold) continue;
    const k = l.productType;
    const e = byType.get(k) || { type: k, label: TYPE_LABEL[k] || k, quoted: 0, sold: 0 };
    if (isQuote) e.quoted += l.subtotal; else e.sold += l.rev;
    byType.set(k, e);
  }
  // Drop stray type codes with negligible volume — they add a row to the table
  // and nothing to the decision.
  const typeTotal = [...byType.values()].reduce((a, e) => a + e.quoted + e.sold, 0);
  const types = [...byType.values()]
    .map(e => Object.assign(e, { share: (e.quoted + e.sold) ? e.quoted / (e.quoted + e.sold) * 100 : 0 }))
    .filter(e => (e.quoted + e.sold) > typeTotal * 0.005)
    .sort((a, b) => b.quoted - a.quoted);

  // Leak against vehicle age — the clearest single explanation of where it goes.
  const ageOf = r => {
    const b = parseInt((r.buildDate || '').slice(0, 4), 10);
    if (!b) return null;
    const a = r.y - b;
    return (a < 0 || a > 40) ? null : a;
  };
  const BANDS = [[0, 3, '0–3 yr'], [4, 7, '4–7 yr'], [8, 11, '8–11 yr'], [12, 15, '12–15 yr'], [16, 99, '16+ yr']];
  const bandOf = a => (BANDS.find(b => a >= b[0] && a <= b[1]) || BANDS[BANDS.length - 1])[2];
  const ages = new Map(BANDS.map(b => [b[2], { band: b[2], quoted: 0, sold: 0, n: 0 }]));
  for (const r of quotes) { const a = ageOf(r); if (a == null) continue; const e = ages.get(bandOf(a)); e.quoted += r.subtotal; e.n++; }
  for (const r of sold) { const a = ageOf(r); if (a == null) continue; ages.get(bandOf(a)).sold += r.exHst; }
  const ageBands = [...ages.values()]
    .map(e => Object.assign(e, { share: (e.quoted + e.sold) ? e.quoted / (e.quoted + e.sold) * 100 : 0 }))
    .filter(e => e.quoted > 0 || e.sold > 0);

  // The call-back list: recent quotes on vehicles that have not been back.
  // Deliberately measured over a fixed recent window rather than the selected
  // period, because it is an action list, not a report.
  const recallFrom = shiftKeyMonths(asOfKey, -3);
  const lastVisit = new Map();
  for (const s of salesRows) {
    const p = (s.license || '').toUpperCase();
    if (!p) continue;
    const prev = lastVisit.get(p);
    if (prev === undefined || s.dateKey > prev) lastVisit.set(p, s.dateKey);
  }
  const recall = pipelineRows
    .filter(r => r.kind === 'quote' && r.dateKey >= recallFrom && r.license)
    .filter(r => (lastVisit.get(r.license.toUpperCase()) || 0) < r.dateKey)
    .sort((a, b) => b.subtotal - a.subtotal);

  return {
    quotes: quotes.length, quoted, soldValue,
    perDollar: soldValue ? quoted / soldValue : 0,
    share: (quoted + soldValue) ? quoted / (quoted + soldValue) * 100 : 0,
    types, ageBands,
    recall, recallFrom, recallValue: recall.reduce((a, r) => a + r.subtotal, 0),
  };
}

/* Vehicles that are overdue against their OWN rhythm, not a generic interval.
   Every vehicle sets its own baseline from its median gap between visits, so a
   fleet van on a 6-week cycle and a family car on a yearly one are both judged
   fairly. Needs three visits before it will call anything overdue, and ignores
   vehicles gone more than two years — those have left, they are not late. */
function serviceDue(salesRows, asOfKey, opts) {
  const o = opts || {};
  const minVisits = o.minVisits || 3;
  const lateFactor = o.lateFactor || 1.5;
  const goneDays = o.goneDays || 730;
  const dayOf = k => { const d = keyToDate(k); return Math.round(Date.UTC(d.y, d.mo - 1, d.d) / 86400000); };
  const today = dayOf(asOfKey);

  const byPlate = new Map();
  for (const s of salesRows) {
    const p = (s.license || '').trim().toUpperCase();
    if (!p) continue;
    if (!byPlate.has(p)) byPlate.set(p, []);
    byPlate.get(p).push(s);
  }
  const median = a => { const b = a.slice().sort((x, y) => x - y); return b[Math.floor(b.length / 2)]; };

  const due = [];
  const allIntervals = [], kmPerYear = [];
  for (const [plate, arr] of byPlate) {
    arr.sort((a, b) => a.dateKey - b.dateKey);
    const gaps = [];
    for (let i = 1; i < arr.length; i++) {
      const g = dayOf(arr[i].dateKey) - dayOf(arr[i - 1].dateKey);
      // Two invoices on the same day are one visit split in two, not a
      // zero-day service interval. Counting them would drag the median down
      // and make vehicles look overdue when they are not.
      if (g > 0) { gaps.push(g); allIntervals.push(g); }
    }
    // Distance travelled between visits, ignoring impossible readings.
    const odo = arr.filter(s => s.odometer > 100 && s.odometer < 500000);
    for (let i = 1; i < odo.length; i++) {
      const dk = odo[i].odometer - odo[i - 1].odometer;
      const dd = dayOf(odo[i].dateKey) - dayOf(odo[i - 1].dateKey);
      if (dd >= 30 && dk > 0 && dk < 100000) kmPerYear.push(dk / dd * 365);
    }
    if (arr.length < minVisits || !gaps.length) continue;
    const usual = median(gaps);
    if (usual < 14 || usual > 900) continue;          // too erratic to judge
    const last = arr[arr.length - 1];
    const since = today - dayOf(last.dateKey);
    if (since <= usual * lateFactor || since > goneDays) continue;
    due.push({
      plate, customer: last.customer,
      vehicle: [last.make, last.model].filter(Boolean).join(' '),
      buildDate: last.buildDate,
      visits: arr.length, usual, since,
      lastVisit: last.dateKey,
      avgSpend: arr.reduce((a, s) => a + s.exHst, 0) / arr.length,
      odometer: last.odometer,
    });
  }
  due.sort((a, b) => b.avgSpend - a.avgSpend);
  return {
    due,
    atStake: due.reduce((a, r) => a + r.avgSpend, 0),
    vehicles: byPlate.size,
    returning: [...byPlate.values()].filter(a => a.length > 1).length,
    medianInterval: allIntervals.length ? median(allIntervals) : null,
    medianKmPerYear: kmPerYear.length ? median(kmPerYear) : null,
  };
}

// Job cards opened as invoices but never closed — billing leakage rather than
// declined work, and a different fix (bookkeeping, not selling).
function staleJobCards(pipelineRows, fromKey, toKey) {
  const rows = pipelineRows.filter(r =>
    r.kind === 'open' && r.invType === 'I' &&
    (fromKey == null || r.dateKey >= fromKey) && (toKey == null || r.dateKey <= toKey));
  const byYear = new Map();
  for (const r of rows) {
    const e = byYear.get(r.y) || { y: r.y, n: 0, value: 0 };
    e.n++; e.value += r.subtotal;
    byYear.set(r.y, e);
  }
  return {
    n: rows.length,
    value: rows.reduce((a, r) => a + r.subtotal, 0),
    years: [...byYear.values()].sort((a, b) => a.y - b.y),
    rows: rows.slice().sort((a, b) => b.subtotal - a.subtotal),
  };
}

function shiftKeyMonths(dk, delta) {
  const p = keyToDate(dk);
  const t = p.y * 12 + (p.mo - 1) + delta;
  const y = Math.floor(t / 12), mo = (t % 12 + 12) % 12 + 1;
  return dateKeyOf(y, mo, Math.min(p.d, daysInMonth(y, mo)));
}

/* Inventory is a SNAPSHOT of what is on the shelves right now — unlike every
   other section it does not move with the selected period. Velocity is
   measured over the 12 months ending at the most recent transaction on file.

   Two rules earned by the data:
     * Only quantity_on_hand > 0 counts as stock. Thousands of service codes
       (LABOUR, DISPFEE, TIREVALVE…) are decremented without ever being
       stocked, so they sit at large negative counts and would otherwise
       swamp every total.
     * "Sold out" is only claimed for an item whose product group actually
       contains stocked goods, and which has a cost. Without that test the
       list fills up with labour and fee codes that are permanently at zero. */
function inventoryAnalysis(products, lines, asOfKey) {
  if (!products.length) return null;
  const c12 = shiftKeyMonths(asOfKey, -12);
  const c6 = shiftKeyMonths(asOfKey, -6);
  const units12 = new Map(), lastSold = new Map(), rev12 = new Map();
  for (const l of lines) {
    if (!l.sold || !l.code || !l.dateKey) continue;
    const prev = lastSold.get(l.code);
    if (prev === undefined || l.dateKey > prev) lastSold.set(l.code, l.dateKey);
    if (l.dateKey >= c12) {
      units12.set(l.code, (units12.get(l.code) || 0) + l.qty);
      rev12.set(l.code, (rev12.get(l.code) || 0) + l.rev);
    }
  }
  const stocked = products.filter(p => p.qoh > 0);
  const decorate = p => {
    const u = units12.get(p.code) || 0;
    return {
      code: p.code, desc: p.desc, group: p.group, supplier: p.supplier,
      qoh: p.qoh, cost: p.cost, retail: p.retail, value: p.value,
      units12: u, rev12: rev12.get(p.code) || 0,
      lastSold: lastSold.get(p.code) || 0,
      monthsCover: u > 0 ? p.qoh / (u / 12) : null,
    };
  };
  const rows = stocked.map(decorate);
  const sum = a => a.reduce((x, p) => x + p.value, 0);
  const dead12 = rows.filter(p => p.lastSold < c12);
  const dead6 = rows.filter(p => p.lastSold < c6);
  const never = rows.filter(p => !p.lastSold);
  const overstock = rows.filter(p => p.monthsCover != null && p.monthsCover > 12);

  const stockedGroups = new Set(stocked.filter(p => p.group).map(p => p.group));
  const soldOut = products
    .filter(p =>
      p.qoh === 0 && p.cost > 0 &&
      p.group && stockedGroups.has(p.group) &&
      // The shop codes labour and service operations SVC-*; 73 such codes
      // exist and not one has ever carried stock, so they are never "sold out".
      !/^SVC-/i.test(p.code) &&
      (units12.get(p.code) || 0) > 0 && (rev12.get(p.code) || 0) > 0)
    .map(decorate)
    .sort((a, b) => b.units12 - a.units12);

  const groups = new Map();
  for (const p of rows) {
    const k = p.group || '(ungrouped)';
    const g = groups.get(k) || { name: k, skus: 0, units: 0, value: 0, dead: 0 };
    g.skus++; g.units += p.qoh; g.value += p.value;
    if (p.lastSold < c12) g.dead += p.value;
    groups.set(k, g);
  }

  return {
    asOfKey,
    skus: rows.length,
    units: rows.reduce((a, p) => a + p.qoh, 0),
    value: sum(rows),
    retailValue: rows.reduce((a, p) => a + p.qoh * p.retail, 0),
    dead12: { n: dead12.length, value: sum(dead12), rows: dead12.sort((a, b) => b.value - a.value) },
    dead6: { n: dead6.length, value: sum(dead6) },
    never: { n: never.length, value: sum(never) },
    overstock: { n: overstock.length, value: sum(overstock) },
    soldOut,
    groups: [...groups.values()].sort((a, b) => b.value - a.value),
    negativeStock: products.filter(p => p.qoh < 0).length,
  };
}

// Customers whose first-ever invoice falls inside the window, vs those who had
// been seen before it. Needs the full history, not just the window.
function newVsReturning(rows, fromKey, toKey) {
  const firstSeen = new Map();
  for (const r of rows) {
    const k = r.customer.toLowerCase();
    const prev = firstSeen.get(k);
    if (prev === undefined || r.dateKey < prev) firstSeen.set(k, r.dateKey);
  }
  const inWindow = new Set();
  for (const r of rows) {
    if (fromKey != null && r.dateKey < fromKey) continue;
    if (toKey != null && r.dateKey > toKey) continue;
    inWindow.add(r.customer.toLowerCase());
  }
  let fresh = 0;
  for (const k of inWindow) if (firstSeen.get(k) >= fromKey) fresh++;
  return { total: inWindow.size, fresh, returning: inWindow.size - fresh };
}
