<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIRE+ Orleans — Sales Reports</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23d61f26'/><circle cx='50' cy='50' r='20' fill='white'/></svg>">
<style>
  :root {
    --brand: #d61f26;
    --ink: #1b1d21;
    --muted: #6b7280;
    --bg: #eef0f3;
    --panel: #ffffff;
    --border: #d8dbe1;
    --soft: #f6f7f9;
    --good: #0f7b3d;
    --bad: #b42318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ---------- App chrome (never printed) ---------- */
  .appbar {
    background: #17191d;
    color: #fff;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px;
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .brand .tire { font-size: 19px; font-weight: 800; letter-spacing: .5px; }
  .brand .plus { color: var(--brand); font-weight: 800; font-size: 19px; }
  .brand .loc { color: #b7bcc5; font-size: 13px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
  .appbar .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border);
    background: #fff; color: var(--ink);
    border-radius: 8px; padding: 7px 14px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover { background: #b8161d; }
  .btn.ghost { background: transparent; border-color: #3a3e46; color: #e6e8ec; }
  .btn.ghost:hover { background: #262a30; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .tabsbar {
    background: #fff; border-bottom: 1px solid var(--border);
    display: flex; gap: 4px; padding: 0 18px;
    position: sticky; top: 51px; z-index: 19;
    overflow-x: auto;
  }
  .tabsbar button {
    border: 0; background: none; cursor: pointer;
    padding: 11px 14px 9px; font-size: 13.5px; font-weight: 700; color: var(--muted);
    border-bottom: 3px solid transparent; white-space: nowrap;
  }
  .tabsbar button.on { color: var(--ink); border-bottom-color: var(--brand); }
  .tabsbar button .cnt { font-weight: 600; color: var(--muted); font-size: 11.5px; margin-left: 4px; }

  .controls {
    max-width: 1240px; margin: 16px auto 0; padding: 0 16px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .field select, .field input[type="date"], .field input[type="search"] {
    border: 1px solid var(--border); border-radius: 8px;
    background: #fff; color: var(--ink);
    padding: 7px 9px; font-size: 13px; min-height: 34px;
  }
  .field input[type="search"] { width: 230px; }
  .checkline { display: flex; align-items: center; gap: 6px; min-height: 34px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button {
    border: 0; background: transparent; padding: 7px 12px;
    font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on { background: var(--ink); color: #fff; }
  .monthnav { display: inline-flex; align-items: center; gap: 6px; }
  .monthnav .btn { padding: 7px 10px; }

  .summary {
    max-width: 1240px; margin: 14px auto 0; padding: 0 16px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px;
  }
  .card .k { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .card .v { font-size: 20px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .card .s { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .card .v.neg { color: var(--bad); }

  .paper-wrap { max-width: 1240px; margin: 16px auto 60px; padding: 0 16px; }
  .sheet {
    background: #fff; border: 1px solid var(--border); border-radius: 4px;
    box-shadow: 0 2px 14px rgba(15, 17, 20, .08);
    padding: 34px 36px 28px;
    overflow-x: auto;
  }

  /* ---------- The report (screen + print) ---------- */
  .rpt-title { text-align: center; font-size: 21px; font-weight: 800; margin: 0 0 2px; }
  .rpt-range { text-align: center; font-size: 13px; margin: 0 0 16px; }
  .rpt-note { text-align: center; font-size: 12px; color: var(--muted); margin: -10px 0 14px; }
  .rpt-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 940px; }
  .rpt-table th {
    text-align: left; font-weight: 700; font-size: 11px;
    border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink);
    padding: 5px 5px; white-space: nowrap;
  }
  .rpt-table td { padding: 4px 5px; vertical-align: top; }
  .rpt-table .num, .rpt-table th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rpt-table tbody.grp tr.inv:nth-child(even) td { background: #fafbfc; }
  .rpt-table td.neg { color: var(--bad); }
  tr.cust-name td { font-weight: 700; padding-top: 8px; font-size: 12.5px; }
  tr.subtotal td { font-weight: 700; border-top: 1px solid #9aa0aa; border-bottom: 1px solid #e3e5ea; }
  tr.subtotal td.lbl { text-align: right; }
  tr.grand td { font-weight: 800; border-top: 2px solid var(--ink); border-bottom: 2.5px double var(--ink); font-size: 12.5px; padding-top: 6px; padding-bottom: 6px; }
  tr.grand td.lbl { text-align: right; }
  .rpt-footer { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 14px; }
  .rpt-empty { text-align: center; color: var(--muted); padding: 30px 0 20px; font-size: 14px; }

  /* ---------- Empty state / drop zone ---------- */
  .empty { text-align: center; padding: 60px 20px 70px; }
  .empty h2 { margin: 0 0 6px; font-size: 20px; }
  .empty p { margin: 4px 0; color: var(--muted); }
  .empty .bigdrop {
    margin: 22px auto 0; max-width: 560px;
    border: 2px dashed #b9bfc9; border-radius: 14px;
    padding: 36px 24px; background: var(--soft);
  }
  .empty .bigdrop strong { font-size: 15px; }
  .empty .actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; }
  .linklike { background: none; border: none; color: var(--brand); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; }

  .drop-overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(23, 25, 29, .82); color: #fff;
    align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    border: 6px dashed rgba(255,255,255,.5);
  }
  .drop-overlay.on { display: flex; }

  .datastrip {
    max-width: 1240px; margin: 10px auto 0; padding: 0 16px;
    font-size: 12px; color: var(--muted);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .datastrip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 5px; }

  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #17191d; color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 60;
    max-width: 80vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Print ---------- */
  @page { size: A4 portrait; margin: 12mm 9mm 12mm; }
  @media print {
    body { background: #fff; }
    .no-print, #toast, .drop-overlay { display: none !important; }
    .paper-wrap { max-width: none; margin: 0; padding: 0; }
    .sheet { border: 0; box-shadow: none; border-radius: 0; padding: 0; overflow: visible; }
    .rpt-table { font-size: 8.6px; min-width: 0; }
    .rpt-table th { font-size: 8.4px; padding: 3px 3px; }
    .rpt-table td { padding: 2.4px 3px; }
    tr.cust-name td { font-size: 8.8px; padding-top: 5px; }
    tr.grand td { font-size: 8.8px; }
    .rpt-table tbody.grp tr.inv:nth-child(even) td { background: none; }
    .rpt-table td.neg { color: #000; }
    .rpt-title { font-size: 16px; }
    .rpt-range { font-size: 10.5px; margin-bottom: 10px; }
    .rpt-note { font-size: 9px; margin: -6px 0 8px; color: #000; }
    .rpt-footer { font-size: 8.5px; color: #000; }
    thead { display: table-header-group; }
    tbody.grp { page-break-inside: avoid; break-inside: avoid; }
    tr { page-break-inside: avoid; break-inside: avoid; }
    tbody.grp.big { page-break-inside: auto; break-inside: auto; }
  }
</style>
</head>
<body>

<header class="appbar no-print">
  <div class="brand">
    <span class="tire">TIRE<span class="plus">+</span></span>
    <span class="loc">Orleans · Sales Reports</span>
  </div>
  <div class="spacer"></div>
  <button class="btn ghost" id="btnImport" title="Import one or more report CSV exports (Sales, Sales Breakup, Item Sales)">⬆ Import CSV</button>
  <button class="btn ghost" id="btnExport" title="Download the current view as a clean CSV">⬇ Export filtered</button>
  <button class="btn ghost danger" id="btnClear" title="Remove all imported data from this browser">Clear data</button>
  <button class="btn primary" id="btnPrint">🖨 Print report</button>
</header>

<nav class="tabsbar no-print" id="tabsbar">
  <button data-t="sales">Sales report<span class="cnt" id="cntSales"></span></button>
  <button data-t="breakup">Categories<span class="cnt" id="cntBreakup"></span></button>
  <button data-t="items">Items<span class="cnt" id="cntItems"></span></button>
</nav>

<section class="controls no-print" id="controls">
  <div class="field">
    <label>Period</label>
    <div class="seg" id="segPeriod">
      <button data-p="month">Month</button>
      <button data-p="year">Full year</button>
      <button data-p="range">Date range</button>
      <button data-p="all">All data</button>
    </div>
  </div>
  <div class="field" id="fMonth">
    <label>Month</label>
    <div class="monthnav">
      <button class="btn" id="prevMonth" title="Previous month">‹</button>
      <select id="selMonth"></select>
      <select id="selYear"></select>
      <button class="btn" id="nextMonth" title="Next month">›</button>
    </div>
  </div>
  <div class="field" id="fYearOnly" style="display:none">
    <label>Year</label>
    <select id="selYear2"></select>
  </div>
  <div class="field" id="fFrom" style="display:none">
    <label>From</label>
    <input type="date" id="dateFrom">
  </div>
  <div class="field" id="fTo" style="display:none">
    <label>To</label>
    <input type="date" id="dateTo">
  </div>
  <div class="field" id="fType">
    <label>Type</label>
    <select id="selType"><option value="">All types</option></select>
  </div>
  <div class="field" id="fCategory" style="display:none">
    <label>Category</label>
    <select id="selCategory"><option value="">All categories</option></select>
  </div>
  <div class="field" id="fSort" style="display:none">
    <label>Sort items by</label>
    <select id="selSort">
      <option value="sell">Revenue</option>
      <option value="qty">Qty sold</option>
      <option value="profit">Profit</option>
      <option value="margin">Margin %</option>
      <option value="code">Item code</option>
    </select>
  </div>
  <div class="field">
    <label>Search</label>
    <input type="search" id="inpSearch" placeholder="Customer, ref # or license…">
  </div>
  <div class="field" id="fView">
    <label>Layout</label>
    <div class="seg" id="segView">
      <button data-v="customer">By customer</button>
      <button data-v="date">By date</button>
    </div>
  </div>
  <div class="field" id="fTotalsOnly" style="display:none">
    <label>Detail</label>
    <label class="checkline"><input type="checkbox" id="chkTotalsOnly"> Totals only</label>
  </div>
</section>

<section class="datastrip no-print" id="datastrip"></section>
<section class="summary no-print" id="summary"></section>

<main class="paper-wrap">
  <div class="sheet" id="sheet"></div>
</main>

<div class="drop-overlay" id="dropOverlay">Drop CSV file(s) to import</div>
<input type="file" id="fileInput" accept=".csv,text/csv" multiple hidden>
<div id="toast"></div>

<script>
/* =====================================================================
   CORE LOGIC — pure functions, no DOM access (testable in Node)
   ===================================================================== */

// RFC-4180-ish CSV parser: quotes, escaped quotes, CR/LF/CRLF, BOM.
function parseCsv(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQ = false;
      } else field += c;
    } else if (c === '"') {
      inQ = true;
    } else if (c === ',') {
      row.push(field); field = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); field = '';
      rows.push(row); row = [];
    } else {
      field += c;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseDateCell(s) {
  s = String(s || '').trim();
  let m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);       // MM/DD/YYYY
  if (m) return { y: +m[3], mo: +m[1], d: +m[2] };
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{2})$/.exec(s);           // MM/DD/YY
  if (m) { const yy = +m[3]; return { y: yy < 70 ? 2000 + yy : 1900 + yy, mo: +m[1], d: +m[2] }; }
  m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);             // YYYY-MM-DD
  if (m) return { y: +m[1], mo: +m[2], d: +m[3] };
  return null;
}

function dateKeyOf(y, mo, d) { return y * 10000 + mo * 100 + d; }

function parseMoney(s) {
  if (typeof s === 'number') return s;
  s = String(s || '').trim();
  if (!s) return 0;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[$,\s]/g, '');
  if (s.startsWith('-')) { neg = true; s = s.slice(1); }
  const v = parseFloat(s);
  if (!isFinite(v)) return 0;
  return neg ? -v : v;
}

/* ---------- format detection ---------- */
// The three known point-of-sale exports, told apart by their title row
// (or, failing that, by their header row).
function detectFormat(rows) {
  const scan = Math.min(rows.length, 12);
  for (let i = 0; i < scan; i++) {
    for (const c of rows[i]) {
      const t = String(c).trim().toLowerCase();
      if (t === 'item sales report') return 'items';
      if (t === 'sales breakup report') return 'breakup';
      if (t === 'sales report') return 'sales';
    }
  }
  for (let i = 0; i < Math.min(rows.length, 80); i++) {
    const cells = rows[i].map(c => String(c).trim().toLowerCase());
    if (cells.includes('qty sold') && cells.includes('invoice ref')) return 'items';
    if (cells.includes('make/model')) return 'breakup';
    if (cells.includes('ref') && cells.includes('customer') && cells.includes('ex hst')) return 'sales';
  }
  return 'sales'; // legacy behavior: try the transactions extractor
}

/* ---------- Sales Report (transactions) ---------- */
const FALLBACK_COLS = { ref: 0, date: 4, type: 5, customer: 6, advisor: 7, license: 8, exHst: 10, hst: 11, dc: 12, total: 13, cost: 14, profit: 15 };

const HEADER_ALIASES = {
  ref:      ['ref', 'ref #', 'reference', 'invoice #', 'invoice'],
  date:     ['date', 'invoice date'],
  type:     ['type', 'doc type'],
  customer: ['customer', 'customer name', 'client'],
  advisor:  ['service advisor', 'advisor'],
  license:  ['license', 'licence', 'license plate', 'plate'],
  exHst:    ['ex hst', 'ex. hst', 'ex-hst', 'subtotal', 'amount ex hst'],
  hst:      ['hst', 'tax', 'gst/hst'],
  dc:       ['d/c', 'dc', 'discount'],
  total:    ['total', 'total inc hst'],
  cost:     ['cost ex. hst', 'cost ex hst', 'cost', 'cost ex. tax'],
  profit:   ['profit', 'gross profit'],
};

function findColumns(rows) {
  const scan = Math.min(rows.length, 80);
  for (let i = 0; i < scan; i++) {
    const cells = rows[i].map(c => String(c).trim().toLowerCase());
    if (cells.includes('ref') && cells.includes('date') && cells.includes('customer')) {
      const map = {};
      for (const key of Object.keys(HEADER_ALIASES)) {
        for (let j = 0; j < cells.length; j++) {
          if (HEADER_ALIASES[key].includes(cells[j])) { map[key] = j; break; }
        }
      }
      if (map.ref != null && map.date != null && map.customer != null) return map;
    }
  }
  return null;
}

// Pull real invoice/credit rows out of a raw report export, ignoring the
// title block, repeated page headers, per-customer subtotal rows, grand
// total row and "Page x of y" footers.
function extractInvoices(rows) {
  const cols = findColumns(rows) || FALLBACK_COLS;
  const out = [];
  for (const r of rows) {
    const ref = String(r[cols.ref] || '').trim();
    if (!/^\d+$/.test(ref)) continue;
    const dt = parseDateCell(r[cols.date]);
    if (!dt) continue;
    const get = k => (cols[k] == null ? '' : String(r[cols[k]] || '').trim());
    out.push({
      ref,
      y: dt.y, mo: dt.mo, d: dt.d,
      dateKey: dateKeyOf(dt.y, dt.mo, dt.d),
      type: get('type') || 'Invoice',
      customer: get('customer') || '(No customer)',
      advisor: get('advisor'),
      license: get('license'),
      exHst: parseMoney(get('exHst')),
      hst: parseMoney(get('hst')),
      dc: parseMoney(get('dc')),
      total: parseMoney(get('total')),
      cost: parseMoney(get('cost')),
      profit: parseMoney(get('profit')),
    });
  }
  return out;
}

/* ---------- Sales Breakup Report (line items by category) ---------- */
// Fixed layout (the export's header row is misaligned with its data by one
// column around "Cost Ex.", so header-mapping cannot be trusted here):
// 0=Ref 4=Date 5=Item Code 6=Description 7=Type 8=Customer 10=License
// 11=Make/Model 12=Amount 14=Cost Ex. 15=HST 16=Profit.
// Rows belong to the category named by the group-header line above them
// (SUBLET REPAIR / LABOUR / STOCK / TIRES / CONSUMABLES).
function extractBreakup(rows) {
  const out = [];
  const occ = new Map();
  let category = 'UNCATEGORIZED';
  for (const r of rows) {
    const c0 = String(r[0] || '').trim();
    const dt = r.length >= 17 ? parseDateCell(r[4]) : null;
    if (/^\d+$/.test(c0) && dt) {
      const t = i => String(r[i] || '').trim();
      const row = {
        ref: c0,
        y: dt.y, mo: dt.mo, d: dt.d,
        dateKey: dateKeyOf(dt.y, dt.mo, dt.d),
        category,
        code: t(5),
        desc: t(6),
        type: t(7) || 'Invoice',
        customer: t(8),
        license: t(10),
        vehicle: t(11),
        amount: parseMoney(t(12)),
        cost: parseMoney(t(14)),
        hst: parseMoney(t(15)),
        profit: parseMoney(t(16)),
      };
      // Stable id: natural key + occurrence index, so re-importing the same
      // or an overlapping export never duplicates rows, while genuinely
      // repeated line items within one invoice are preserved.
      const base = [row.ref, row.dateKey, row.code, row.desc, row.amount].join('|');
      const n = (occ.get(base) || 0) + 1;
      occ.set(base, n);
      row.id = base + '#' + n;
      out.push(row);
    } else if (c0 && !/^\d+$/.test(c0) && !(r[4] && String(r[4]).trim()) &&
               c0 !== 'Ref' && !c0.startsWith('Page') && !c0.startsWith('Grand') &&
               !c0.startsWith('Date') && !c0.includes('Total:')) {
      category = c0;
    }
  }
  return out;
}

/* ---------- Item Sales Report (per-product sales) ---------- */
// Layout: 0=Date(MM/DD/YY) 2=Invoice Ref 4=Item Code 5=Service Advisor
// 6=Description 7=Supplier 8=QOH 9=Qty Sold 10=Sell Price 12=Unit Cost 14=Cost.
// Sell Price and Cost are line totals; Unit Cost is per unit.
function extractItems(rows) {
  const out = [];
  const occ = new Map();
  for (const r of rows) {
    if (r.length < 15) continue;
    const dt = parseDateCell(r[0]);
    const ref = String(r[2] || '').trim();
    if (!dt || !/^\d+$/.test(ref)) continue;
    const t = i => String(r[i] || '').trim();
    const row = {
      ref,
      y: dt.y, mo: dt.mo, d: dt.d,
      dateKey: dateKeyOf(dt.y, dt.mo, dt.d),
      code: t(4),
      advisor: t(5),
      desc: t(6),
      supplier: t(7),
      qty: parseMoney(t(9)),
      sell: parseMoney(t(10)),
      unitCost: parseMoney(t(12)),
      cost: parseMoney(t(14)),
    };
    const base = [row.ref, row.dateKey, row.code, row.sell].join('|');
    const n = (occ.get(base) || 0) + 1;
    occ.set(base, n);
    row.id = base + '#' + n;
    out.push(row);
  }
  return out;
}

/* ---------- report building ---------- */
function sumRows(rows) {
  const t = { exHst: 0, hst: 0, dc: 0, total: 0, cost: 0, profit: 0 };
  for (const r of rows) {
    t.exHst += r.exHst; t.hst += r.hst; t.dc += r.dc;
    t.total += r.total; t.cost += r.cost; t.profit += r.profit;
  }
  return t;
}

// GP% as the source system computes it: profit ÷ (Ex HST − D/C).
function gpPercent(exHst, dc, profit) {
  const den = exHst - dc;
  if (Math.abs(den) < 1e-9) return 0;
  return (profit / den) * 100;
}

function byCustomerName(a, b) {
  const la = a.toLowerCase(), lb = b.toLowerCase();
  return la < lb ? -1 : la > lb ? 1 : 0;
}

function byDateThenRef(a, b) {
  return (a.dateKey - b.dateKey) || (parseInt(a.ref, 10) - parseInt(b.ref, 10));
}

function inRange(r, f) {
  if (f.fromKey != null && r.dateKey < f.fromKey) return false;
  if (f.toKey != null && r.dateKey > f.toKey) return false;
  return true;
}

// filters: { fromKey, toKey, search, type, groupBy: 'customer'|'date' }
function buildReport(invoices, filters) {
  const f = filters || {};
  const q = (f.search || '').trim().toLowerCase();
  const rows = invoices.filter(r => {
    if (!inRange(r, f)) return false;
    if (f.type && r.type !== f.type) return false;
    if (q && !(r.customer.toLowerCase().includes(q) ||
               r.ref.includes(q) ||
               r.license.toLowerCase().includes(q))) return false;
    return true;
  });

  const totals = sumRows(rows);
  const customers = new Set(rows.map(r => r.customer.toLowerCase()));
  const report = {
    rows,
    totals,
    gp: gpPercent(totals.exHst, totals.dc, totals.profit),
    invoiceCount: rows.filter(r => r.type === 'Invoice').length,
    creditCount: rows.filter(r => r.type === 'Credit').length,
    customerCount: customers.size,
    groups: null,
  };

  if ((f.groupBy || 'customer') === 'customer') {
    const map = new Map();
    for (const r of rows) {
      const key = r.customer.toLowerCase();
      if (!map.has(key)) map.set(key, { name: r.customer, rows: [] });
      map.get(key).rows.push(r);
    }
    const groups = [...map.values()].sort((a, b) => byCustomerName(a.name, b.name));
    for (const g of groups) {
      g.rows.sort(byDateThenRef);
      g.totals = sumRows(g.rows);
      g.gp = gpPercent(g.totals.exHst, g.totals.dc, g.totals.profit);
    }
    report.groups = groups;
  } else {
    report.rows = rows.slice().sort(byDateThenRef);
  }
  return report;
}

function sumBreakup(rows) {
  const t = { n: rows.length, amount: 0, cost: 0, hst: 0, profit: 0 };
  for (const r of rows) { t.amount += r.amount; t.cost += r.cost; t.hst += r.hst; t.profit += r.profit; }
  return t;
}

// filters: { fromKey, toKey, search, type, category }
function buildBreakupReport(lines, filters) {
  const f = filters || {};
  const q = (f.search || '').trim().toLowerCase();
  const rows = lines.filter(r => {
    if (!inRange(r, f)) return false;
    if (f.type && r.type !== f.type) return false;
    if (f.category && r.category !== f.category) return false;
    if (q && !(r.customer.toLowerCase().includes(q) ||
               r.ref.includes(q) ||
               r.license.toLowerCase().includes(q) ||
               r.code.toLowerCase().includes(q) ||
               r.desc.toLowerCase().includes(q) ||
               r.vehicle.toLowerCase().includes(q))) return false;
    return true;
  });
  const map = new Map();
  for (const r of rows) {
    if (!map.has(r.category)) map.set(r.category, { name: r.category, rows: [] });
    map.get(r.category).rows.push(r);
  }
  const cats = [...map.values()];
  for (const c of cats) {
    c.rows.sort(byDateThenRef);
    c.totals = sumBreakup(c.rows);
    c.gp = c.totals.amount ? (c.totals.profit / c.totals.amount) * 100 : 0;
  }
  cats.sort((a, b) => b.totals.amount - a.totals.amount);
  const totals = sumBreakup(rows);
  return {
    rows, cats, totals,
    gp: totals.amount ? (totals.profit / totals.amount) * 100 : 0,
    refCount: new Set(rows.map(r => r.ref)).size,
  };
}

// filters: { fromKey, toKey, search, sort: 'sell'|'qty'|'profit'|'margin'|'code' }
function buildItemsReport(lines, filters) {
  const f = filters || {};
  const q = (f.search || '').trim().toLowerCase();
  const rows = lines.filter(r => {
    if (!inRange(r, f)) return false;
    if (q && !(r.code.toLowerCase().includes(q) ||
               r.desc.toLowerCase().includes(q) ||
               r.supplier.toLowerCase().includes(q) ||
               r.ref.includes(q))) return false;
    return true;
  });
  const map = new Map();
  for (const r of rows) {
    let it = map.get(r.code);
    if (!it) { it = { code: r.code, desc: r.desc, supplier: r.supplier, n: 0, qty: 0, sell: 0, cost: 0 }; map.set(r.code, it); }
    it.n++; it.qty += r.qty; it.sell += r.sell; it.cost += r.cost;
    if (!it.desc && r.desc) it.desc = r.desc;
    if (!it.supplier && r.supplier) it.supplier = r.supplier;
  }
  const items = [...map.values()];
  for (const it of items) {
    it.profit = it.sell - it.cost;
    it.margin = it.sell ? (it.profit / it.sell) * 100 : 0;
  }
  const sort = f.sort || 'sell';
  items.sort((a, b) =>
    sort === 'qty' ? b.qty - a.qty :
    sort === 'profit' ? b.profit - a.profit :
    sort === 'margin' ? b.margin - a.margin :
    sort === 'code' ? (a.code.toLowerCase() < b.code.toLowerCase() ? -1 : 1) :
    b.sell - a.sell);
  const totals = { n: rows.length, qty: 0, sell: 0, cost: 0 };
  for (const r of rows) { totals.qty += r.qty; totals.sell += r.sell; totals.cost += r.cost; }
  totals.profit = totals.sell - totals.cost;
  return {
    rows, items, totals,
    margin: totals.sell ? (totals.profit / totals.sell) * 100 : 0,
    itemCount: items.length,
  };
}

/* ---------- formatting ---------- */
// Formats amounts the way the source report does: $-58.71, no thousands separators.
function fmtMoney(v) {
  let r = Math.round(v * 100) / 100;
  if (Math.abs(r) < 0.005) r = 0;
  const sign = r < 0 ? '-' : '';
  return '$' + sign + Math.abs(r).toFixed(2);
}

function fmtGp(v) { return (Math.abs(v) < 0.005 ? 0 : v).toFixed(2); }

function fmtQty(v) {
  const r = Math.round(v * 100) / 100;
  return String(parseFloat(r.toFixed(2)));
}

function fmtDateMdy(y, mo, d) {
  const p = n => String(n).padStart(2, '0');
  return p(mo) + '/' + p(d) + '/' + y;
}

function daysInMonth(y, mo) { return new Date(y, mo, 0).getDate(); }

/* =====================================================================
   Storage — IndexedDB (with legacy localStorage migration)
   ===================================================================== */
const DB_NAME = 'tireplus-sales';
const LEGACY_KEY = 'tireplusSales.data.v1';
const FILTER_KEY = 'tireplusSales.filters.v2';
const DATASETS = ['sales', 'breakup', 'items'];
const DATASET_LABEL = { sales: 'Sales report', breakup: 'Sales breakup', items: 'Item sales' };

// store[name] = { rows: [...], files: [{name, count, at}] }
let store = { sales: null, breakup: null, items: null };
let db = null;
let persistable = true;

function idbOpen() {
  return new Promise((resolve) => {
    let req;
    try { req = indexedDB.open(DB_NAME, 1); }
    catch (e) { resolve(null); return; }
    req.onupgradeneeded = () => req.result.createObjectStore('datasets', { keyPath: 'name' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}

function idbGetAll() {
  return new Promise((resolve) => {
    if (!db) { resolve([]); return; }
    try {
      const req = db.transaction('datasets', 'readonly').objectStore('datasets').getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    } catch (e) { resolve([]); }
  });
}

function idbPut(name) {
  return new Promise((resolve) => {
    if (!db || !store[name]) { resolve(false); return; }
    try {
      const tx = db.transaction('datasets', 'readwrite');
      tx.objectStore('datasets').put({ name, rows: store[name].rows, files: store[name].files });
      tx.oncomplete = () => resolve(true);
      tx.onerror = tx.onabort = () => resolve(false);
    } catch (e) { resolve(false); }
  });
}

function idbClear() {
  return new Promise((resolve) => {
    if (!db) { resolve(); return; }
    try {
      const tx = db.transaction('datasets', 'readwrite');
      tx.objectStore('datasets').clear();
      tx.oncomplete = tx.onerror = tx.onabort = () => resolve();
    } catch (e) { resolve(); }
  });
}

async function loadStore() {
  db = await idbOpen();
  persistable = !!db;
  for (const rec of await idbGetAll()) {
    if (DATASETS.includes(rec.name) && Array.isArray(rec.rows)) {
      store[rec.name] = { rows: rec.rows, files: rec.files || [] };
    }
  }
  // Migrate data saved by the previous localStorage-based version.
  try {
    const raw = localStorage.getItem(LEGACY_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.invoices) && !store.sales) {
        store.sales = { rows: s.invoices, files: s.files || [] };
        if (await idbPut('sales')) localStorage.removeItem(LEGACY_KEY);
      } else {
        localStorage.removeItem(LEGACY_KEY);
      }
    }
  } catch (e) { /* ignore */ }
}

async function saveDataset(name) {
  const ok = await idbPut(name);
  if (!ok) {
    persistable = false;
    toast('Data is loaded for this session, but could not be saved for next time.');
  }
}

function idOf(name, r) { return name === 'sales' ? r.ref : r.id; }

function mergeRows(name, newRows, fileName) {
  if (!store[name]) store[name] = { rows: [], files: [] };
  const ds = store[name];
  const byId = new Map(ds.rows.map(r => [idOf(name, r), r]));
  let added = 0, updated = 0;
  for (const r of newRows) {
    const id = idOf(name, r);
    if (byId.has(id)) updated++; else added++;
    byId.set(id, r);
  }
  ds.rows = [...byId.values()];
  ds.files = ds.files.filter(f => f.name !== fileName);
  ds.files.push({ name: fileName, count: newRows.length, at: new Date().toISOString().slice(0, 10) });
  return { added, updated };
}

function rowsOf(name) { return store[name] ? store[name].rows : []; }
function hasAnyData() { return DATASETS.some(n => rowsOf(n).length); }

/* =====================================================================
   Filter state + UI
   ===================================================================== */
const $ = id => document.getElementById(id);
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const BREAKUP_DETAIL_CAP = 8000;

let state = {
  tab: 'sales',
  period: 'month', y: null, mo: null, from: '', to: '',
  search: '', type: '', view: 'customer',
  category: '', itemSort: 'sell', totalsOnly: false,
};

function loadFilters() {
  try {
    const raw = localStorage.getItem(FILTER_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) { /* ignore */ }
  if (!DATASETS.includes(state.tab)) state.tab = 'sales';
}
function saveFilters() {
  try { localStorage.setItem(FILTER_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}

function allRows() { return DATASETS.flatMap(n => rowsOf(n)); }

function dataSpan() {
  let min = null, max = null;
  for (const r of allRows()) {
    if (!min || r.dateKey < min.dateKey) min = r;
    if (!max || r.dateKey > max.dateKey) max = r;
  }
  return min ? { min, max } : null;
}

function ensureValidState() {
  const span = dataSpan();
  if (!span) return;
  const years = [...new Set(allRows().map(r => r.y))].sort();
  if (state.y == null || !years.includes(state.y)) { state.y = span.max.y; state.mo = span.max.mo; }
  if (state.mo == null || state.mo < 1 || state.mo > 12) state.mo = span.max.mo;
  const iso = r => `${r.y}-${String(r.mo).padStart(2,'0')}-${String(r.d).padStart(2,'0')}`;
  if (!state.from) state.from = iso(span.min);
  if (!state.to) state.to = iso(span.max);
  if (rowsOf(state.tab).length === 0) {
    const first = DATASETS.find(n => rowsOf(n).length);
    if (first) state.tab = first;
  }
}

// Effective inclusive date range for the current period selection.
function effectiveRange() {
  const span = dataSpan();
  if (state.period === 'month' && state.y != null) {
    return { from: { y: state.y, mo: state.mo, d: 1 }, to: { y: state.y, mo: state.mo, d: daysInMonth(state.y, state.mo) } };
  }
  if (state.period === 'year' && state.y != null) {
    return { from: { y: state.y, mo: 1, d: 1 }, to: { y: state.y, mo: 12, d: 31 } };
  }
  if (state.period === 'range' && state.from && state.to) {
    const p = s => { const [y, mo, d] = s.split('-').map(Number); return { y, mo, d }; };
    return { from: p(state.from), to: p(state.to) };
  }
  if (span) {
    return { from: { y: span.min.y, mo: span.min.mo, d: span.min.d }, to: { y: span.max.y, mo: span.max.mo, d: span.max.d } };
  }
  const now = new Date();
  const t = { y: now.getFullYear(), mo: now.getMonth() + 1, d: now.getDate() };
  return { from: t, to: t };
}

function rangeLabel() {
  if (state.period === 'month' && state.y != null) return MONTH_NAMES[state.mo - 1] + ' ' + state.y;
  if (state.period === 'year' && state.y != null) return 'Year ' + state.y;
  const r = effectiveRange();
  return fmtDateMdy(r.from.y, r.from.mo, r.from.d) + ' – ' + fmtDateMdy(r.to.y, r.to.mo, r.to.d);
}

const TAB_TITLE = { sales: 'Sales Report', breakup: 'Sales Breakup Report', items: 'Item Sales Report' };

function currentFilters() {
  const r = effectiveRange();
  return {
    fromKey: dateKeyOf(r.from.y, r.from.mo, r.from.d),
    toKey: dateKeyOf(r.to.y, r.to.mo, r.to.d),
    search: state.search,
    type: state.type,
    groupBy: state.view,
    category: state.category,
    sort: state.itemSort,
  };
}

/* ---------- rendering ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function moneyTd(v, cls) {
  return `<td class="num${v < -0.004 ? ' neg' : ''}${cls ? ' ' + cls : ''}">${fmtMoney(v)}</td>`;
}

function reportShell(bodyHtml, sub) {
  const r = effectiveRange();
  const fromStr = fmtDateMdy(r.from.y, r.from.mo, r.from.d);
  const toStr = fmtDateMdy(r.to.y, r.to.mo, r.to.d);
  const today = new Date();
  const printedStr = fmtDateMdy(today.getFullYear(), today.getMonth() + 1, today.getDate());
  const extras = [];
  if (state.type && state.tab !== 'items') extras.push(esc(state.type) + 's only');
  if (state.tab === 'breakup' && state.category) extras.push(esc(state.category));
  if (state.search) extras.push('matching “' + esc(state.search) + '”');
  return {
    html: `
      <h1 class="rpt-title">${TAB_TITLE[state.tab]}</h1>
      <p class="rpt-range">From: ${fromStr} &nbsp;To: ${toStr}${extras.length ? ' &nbsp;·&nbsp; ' + extras.join(' &nbsp;·&nbsp; ') : ''}</p>
      ${bodyHtml}
      <div class="rpt-footer"><span>${sub}</span><span>Date Printed: ${printedStr}</span></div>`,
  };
}

    let body = '';
    for (const c of rep.cats) {
      body += `<tbody class="grp${c.rows.length > 40 ? ' big' : ''}">
        <tr class="cust-name"><td colspan="12">${esc(c.name)}</td></tr>
        ${c.rows.map(breakupTr).join('')}
        <tr class="subtotal"><td colspan="8" class="lbl">${esc(c.name)} Total:</td>${moneyTd(c.totals.amount)}${moneyTd(c.totals.cost)}${moneyTd(c.totals.hst)}${moneyTd(c.totals.profit)}</tr>
      </tbody>`;
    }
    const grand = `<tbody><tr class="grand"><td colspan="8" class="lbl">Grand Total:</td>${moneyTd(rep.totals.amount)}${moneyTd(rep.totals.cost)}${moneyTd(rep.totals.hst)}${moneyTd(rep.totals.profit)}</tr></tbody>`;
    table = `<table class="rpt-table">${head}${body}${grand}</table>`;
  }
  $('sheet').innerHTML = reportShell(table,
    `${rep.totals.n.toLocaleString('en-CA')} line item${rep.totals.n === 1 ? '' : 's'} · ${rep.refCount.toLocaleString('en-CA')} invoices · ${rep.cats.length} categor${rep.cats.length === 1 ? 'y' : 'ies'}`).html;

  const t = rep.totals;
  const top = rep.cats[0];
  renderCards([
    { k: 'Line items', v: t.n.toLocaleString('en-CA'), s: `${rep.refCount.toLocaleString('en-CA')} invoices` },
    { k: 'Top category', v: top ? esc(top.name) : '—', s: top ? locMoney(top.totals.amount) : '' },
    { k: 'Amount (Ex HST)', v: locMoney(t.amount), s: 'HST ' + locMoney(t.hst) },
    { k: 'Cost', v: locMoney(t.cost), s: 'of amount' },
    { k: 'Profit', v: locMoney(t.profit), s: 'amount − cost', neg: t.profit < 0 },
    { k: 'GP %', v: fmtGp(rep.gp) + '%', s: 'profit ÷ amount', neg: rep.gp < 0 },
  ]);
}

/* ----- Items tab ----- */
function renderItemsTab() {
  const rep = buildItemsReport(rowsOf('items'), currentFilters());
  let table;
  if (!rep.rows.length) {
    table = `<div class="rpt-empty">${rowsOf('items').length ? 'No item sales match the current filters for this period.' : 'No Item Sales data imported yet — drop the Item Sales Report CSV export here.'}</div>`;
  } else {
    const head = `<thead><tr>
        <th style="width:11%">Item Code</th><th>Description</th><th style="width:13%">Supplier</th>
        <th class="num" style="width:6%">Sales</th><th class="num" style="width:7%">Qty</th>
        <th class="num" style="width:9%">Revenue</th><th class="num" style="width:9%">Cost</th>
        <th class="num" style="width:9%">Profit</th><th class="num" style="width:7%">Margin%</th>
      </tr></thead>`;
    const body = rep.items.map(it => `<tr class="inv">
        <td>${esc(it.code)}</td>
        <td style="white-space:normal">${esc(it.desc)}</td>
        <td style="white-space:normal">${esc(it.supplier)}</td>
        <td class="num">${it.n}</td>
        <td class="num${it.qty < 0 ? ' neg' : ''}">${fmtQty(it.qty)}</td>
        ${moneyTd(it.sell)}${moneyTd(it.cost)}${moneyTd(it.profit)}
        <td class="num${it.margin < -0.004 ? ' neg' : ''}">${fmtGp(it.margin)}</td>
      </tr>`).join('');
    const t = rep.totals;
    const grand = `<tr class="grand"><td colspan="3" class="lbl">Grand Total:</td><td class="num">${t.n}</td><td class="num">${fmtQty(t.qty)}</td>${moneyTd(t.sell)}${moneyTd(t.cost)}${moneyTd(t.profit)}<td class="num">${fmtGp(rep.margin)}</td></tr>`;

  }
  $('sheet').innerHTML = reportShell(table,
    `${rep.itemCount.toLocaleString('en-CA')} items · ${rep.totals.n.toLocaleString('en-CA')} sale lines`).html;

  const t = rep.totals;
  renderCards([
    { k: 'Items', v: rep.itemCount.toLocaleString('en-CA'), s: 'distinct item codes' },
    { k: 'Units sold', v: (Math.round(t.qty * 100) / 100).toLocaleString('en-CA'), s: `${t.n.toLocaleString('en-CA')} sale lines` },
    { k: 'Revenue', v: locMoney(t.sell), s: 'sell price (Ex HST)' },
    { k: 'Cost', v: locMoney(t.cost), s: 'of revenue' },
    { k: 'Profit', v: locMoney(t.profit), s: 'revenue − cost', neg: t.profit < 0 },
    { k: 'Margin %', v: fmtGp(rep.margin) + '%', s: 'profit ÷ revenue', neg: rep.margin < 0 },
  ]);
}

function renderCards(cards) {
  $('summary').innerHTML = cards.map(c =>
    `<div class="card"><div class="k">${c.k}</div><div class="v${c.neg ? ' neg' : ''}">${c.v}</div><div class="s">${c.s}</div></div>`).join('');
}

function locMoney(v) {
  const r = Math.round(v * 100) / 100;
  return (r < 0 ? '-$' : '$') + Math.abs(r).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function rerender() {
  ensureValidState();
  saveFilters();
  renderControls();

}

function shiftMonth(delta) {
  let y = state.y, mo = state.mo + delta;
  if (mo < 1) { mo = 12; y--; }
  if (mo > 12) { mo = 1; y++; }
  state.y = y; state.mo = mo;
  rerender();
}

/* ---------- import / export ---------- */
function importFiles(fileList) {
  const files = [...fileList].filter(f => /\.csv$/i.test(f.name) || f.type === 'text/csv' || f.type === 'application/vnd.ms-excel');
  if (!files.length) { toast('Please choose a .csv file (a report export).'); return; }
  let done = 0;
  const results = [], failed = [], touched = new Set();
  for (const f of files) {
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const rows = parseCsv(String(reader.result));
        const fmt = detectFormat(rows);
        const parsed = fmt === 'breakup' ? extractBreakup(rows) : fmt === 'items' ? extractItems(rows) : extractInvoices(rows);
        if (!parsed.length) failed.push(f.name);
        else {
          const res = mergeRows(fmt, parsed, f.name);
          touched.add(fmt);
          results.push(`${DATASET_LABEL[fmt]}: ${parsed.length.toLocaleString('en-CA')} rows (${res.added.toLocaleString('en-CA')} new)`);
        }
      } catch (e) { failed.push(f.name); }
      if (++done === files.length) {
        for (const name of touched) await saveDataset(name);
        if (results.length) {
          const span = dataSpan();
          if (span && state.period === 'month') { state.y = span.max.y; state.mo = span.max.mo; }
          if (touched.size === 1 && !rowsOf(state.tab).length) state.tab = [...touched][0];
          toast('Imported — ' + results.join(' · ') + (failed.length ? `. Could not read: ${failed.join(', ')}` : ''));
        } else {
          toast(`No report rows found in ${failed.join(', ') || 'the selected file(s)'} — expected a Sales, Sales Breakup or Item Sales CSV export.`);
        }
        rerender();
      }
    };
    reader.onerror = () => { failed.push(f.name); if (++done === files.length) rerender(); };
    reader.readAsText(f);
  }
}

function exportFiltered() {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  let lines, nameHint;
  if (state.tab === 'breakup') {
    const rep = buildBreakupReport(rowsOf('breakup'), currentFilters());
    lines = [['Category', 'Ref', 'Date', 'Type', 'Customer', 'License', 'Make/Model', 'Item Code', 'Description', 'Amount', 'Cost Ex.', 'HST', 'Profit'].join(',')];
    for (const c of rep.cats) for (const r of c.rows) {
      lines.push([q(c.name), r.ref, fmtDateMdy(r.y, r.mo, r.d), q(r.type), q(r.customer), q(r.license), q(r.vehicle), q(r.code), q(r.desc),
        r.amount.toFixed(2), r.cost.toFixed(2), r.hst.toFixed(2), r.profit.toFixed(2)].join(','));
    }
    nameHint = 'sales-breakup-';
  } else if (state.tab === 'items') {
    const rep = buildItemsReport(rowsOf('items'), currentFilters());
    lines = [['Item Code', 'Description', 'Supplier', 'Sales', 'Qty', 'Revenue', 'Cost', 'Profit', 'Margin%'].join(',')];
    for (const it of rep.items) {
      lines.push([q(it.code), q(it.desc), q(it.supplier), it.n, fmtQty(it.qty),
        it.sell.toFixed(2), it.cost.toFixed(2), it.profit.toFixed(2), fmtGp(it.margin)].join(','));
    }
    nameHint = 'item-sales-';
  } else {
    const rep = buildReport(rowsOf('sales'), currentFilters());
    const rows = rep.groups ? rep.groups.flatMap(g => g.rows) : rep.rows;
    lines = [['Ref', 'Date', 'Type', 'Customer', 'Service Advisor', 'License', 'Ex HST', 'HST', 'D/C', 'Total', 'Cost Ex. HST', 'Profit', 'GP%'].join(',')];
    for (const r of rows) {
      lines.push([r.ref, fmtDateMdy(r.y, r.mo, r.d), q(r.type), q(r.customer), q(r.advisor), q(r.license),
        r.exHst.toFixed(2), r.hst.toFixed(2), r.dc.toFixed(2), r.total.toFixed(2), r.cost.toFixed(2), r.profit.toFixed(2),
        fmtGp(gpPercent(r.exHst, r.dc, r.profit))].join(','));
    }
    nameHint = 'sales-report-';
  }
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (nameHint + rangeLabel().toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.csv').replace(/-+/g, '-');
  a.click();
  URL.revokeObjectURL(a.href);
}

async function clearData() {
  if (!confirm('Remove all imported sales data from this browser? Your original CSV files are not affected.')) return;
  store = { sales: null, breakup: null, items: null };
  await idbClear();
  try { localStorage.removeItem(LEGACY_KEY); } catch (e) { /* ignore */ }
  rerender();
}

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}

/* ---------- wiring ---------- */
async function init() {
  await loadStore();
  loadFilters();

  $('btnImport').addEventListener('click', () => $('fileInput').click());
  $('fileInput').addEventListener('change', e => { importFiles(e.target.files); e.target.value = ''; });
  $('btnPrint').addEventListener('click', () => {
    const old = document.title;
    document.title = TAB_TITLE[state.tab] + ' — ' + rangeLabel();
    window.print();
    setTimeout(() => { document.title = old; }, 500);
  });
  $('btnExport').addEventListener('click', exportFiltered);
  $('btnClear').addEventListener('click', clearData);

  $('tabsbar').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.tab = b.dataset.t; rerender();
  });
  $('segPeriod').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.period = b.dataset.p; rerender();
  });
  $('segView').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.view = b.dataset.v; rerender();
  });
  $('prevMonth').addEventListener('click', () => shiftMonth(-1));
  $('nextMonth').addEventListener('click', () => shiftMonth(1));
  $('selMonth').addEventListener('change', e => { state.mo = +e.target.value; rerender(); });
  $('selYear').addEventListener('change', e => { state.y = +e.target.value; rerender(); });
  $('selYear2').addEventListener('change', e => { state.y = +e.target.value; rerender(); });
  $('selType').addEventListener('change', e => { state.type = e.target.value; rerender(); });
  $('selCategory').addEventListener('change', e => { state.category = e.target.value; rerender(); });
  $('selSort').addEventListener('change', e => { state.itemSort = e.target.value; rerender(); });
  $('chkTotalsOnly').addEventListener('change', e => { state.totalsOnly = e.target.checked; rerender(); });
  $('dateFrom').addEventListener('change', e => { state.from = e.target.value; rerender(); });
  $('dateTo').addEventListener('change', e => { state.to = e.target.value; rerender(); });
  let searchTimer;
  $('inpSearch').addEventListener('input', e => {
    const v = e.target.value;   // capture now — the field may be re-rendered before the debounce fires
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.search = v; rerender(); }, 180);
  });

  // Whole-window drag & drop.
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) $('dropOverlay').classList.add('on'); });
  window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; $('dropOverlay').classList.remove('on'); } });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; $('dropOverlay').classList.remove('on');
    if (e.dataTransfer && e.dataTransfer.files.length) importFiles(e.dataTransfer.files);
  });

  rerender();
}

init();
</script>
</body>
</html>
